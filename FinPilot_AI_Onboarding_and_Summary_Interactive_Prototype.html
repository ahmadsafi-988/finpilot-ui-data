function renderManual(){const dataGroups=[['D2','Cash Transactions','الحركات النقدية','transactions'],['D3','Customer Invoices','فواتير العملاء','customer'],['D4','Supplier Invoices','فواتير الموردين','supplier'],['D5','Financial Obligations','الالتزامات المالية','obligations']];return `<div style="max-width:1030px;margin:25px auto;padding:0 17px"><div class="pagehead"><div><div class="eyebrow">${tr('ONBOARDING / MANUAL ENTRY','التهيئة / الإدخال اليدوي')}</div><h1>${tr('Start from scratch','البدء من الصفر')}</h1><p class="muted">${tr('Enter only the information you have. Missing groups will be flagged, not assumed zero.','أدخل المعلومات المتاحة فقط. ستظهر المجموعات الناقصة ولا تُعتبر صفرًا.')}</p></div>${button('Review Financial Readiness','عرض جاهزية البيانات','goReadiness','primary')}</div><div class="grid cols2"><div class="surface pad stack"><h3>${tr('Your financial data groups','مجموعات البيانات المالية')}</h3>${dataGroups.map(([id,en,ar,key])=>`<div class="quick-item"><div><strong>${id} — ${tr(en,ar)}</strong><div class="small muted">${tr(s.groups[id],statusArabic(s.groups[id]))}</div></div><div class="buttonrow"><button class="btn sm" data-action="manualAdd" data-type="${key}">${ico('plus')}${tr('Add','إضافة')}</button><button class="btn sm" data-action="confirmedNone" data-group="${id}">${tr('None','لا يوجد')}</button></div></div>`).join('')}<div class="small muted">${tr('Accounting Adjustments are separate and can be created when needed; they are not D1–D5.','التسويات المحاسبية منفصلة عن D1–D5 ويمكن إضافتها عند الحاجة.')}</div><button class="btn" data-action="manualAdd" data-type="adjustments">${ico('plus')} ${tr('Accounting Adjustment','تسوية محاسبية')}</button></div><div class="surface pad stack"><h3>${tr('Recommended next steps','الخطوات التالية')}</h3><div class="point">${ico('check')}<div><b>${tr('Mark genuinely absent data as None','أكّد المجموعات غير الموجودة فعليًا')}</b><div class="muted small">${tr('Different from Not Provided.','هذا مختلف عن «لم تُقدّم».')}</div></div></div><div class="point">${ico('file')}<div><b>${tr('Use ordinary financial forms','استخدم نماذج البيانات المعتادة')}</b><div class="muted small">${tr('A saved invoice or obligation never posts cash automatically.','حفظ الفاتورة أو الالتزام لا يُسجّل حركة نقدية تلقائيًا.')}</div></div></div><div class="point">${ico('chart')}<div><b>${tr('See which insights are ready','اعرف المؤشرات المتاحة')}</b><div class="muted small">${tr('Financial Readiness lists unavailable KPIs with reasons.','تعرض الجاهزية المؤشرات غير المتاحة وأسباب ذلك.')}</div></div></div><div class="callout warn">${tr('You may continue to Summary even if every financial group is missing.','يمكنك الذهاب إلى الملخص حتى إن كانت كل المجموعات المالية ناقصة.')}</div><button class="btn primary" data-action="goReadiness">${tr('Go to Financial Readiness','الذهاب إلى جاهزية البيانات')}</button></div></div></div>`}
function statusArabic(name){return ({Configured:'مُعدّة',Entered:'تم الإدخال','Confirmed None':'مؤكّد: لا يوجد','Not Provided':'لم تُقدّم','Needs Attention':'تحتاج إلى مراجعة'})[name]||name;}
function financialReadiness(){return ['D1','D2','D3','D4','D5'].map(g=>({g,status:s.groups[g],title:({D1:tr('Company Financial Setup','الإعداد المالي للشركة'),D2:tr('Cash Transactions','الحركات النقدية'),D3:tr('Customer Invoices','فواتير العملاء'),D4:tr('Supplier Invoices','فواتير الموردين'),D5:tr('Financial Obligations','الالتزامات المالية')})[g]}))}
function renderReadinessPublic(){const gaps=[];if(s.opening==null)gaps.push([tr('Current Cash Balance','الرصيد النقدي الحالي'),tr('Opening cash balance is Unknown.','الرصيد الافتتاحي غير معروف.')]);if(!['Entered','Confirmed None'].includes(s.groups.D2))gaps.push([tr('Net Cash Flow / Cash Runway','صافي التدفق النقدي / مدة كفاية النقد'),tr('D2 cash transaction coverage not provided.','لم تُقدّم بيانات الحركات النقدية D2.')]);if(!['Entered','Confirmed None'].includes(s.groups.D3)||!['Entered','Confirmed None'].includes(s.groups.D4))gaps.push([tr('Net Profit / EBITDA','صافي الربح / الأرباح قبل الفوائد والضرائب والإهلاك'),tr('Customer and supplier recognition records are incomplete.','بيانات الاعتراف بالإيرادات والمصروفات غير مكتملة.')]);if(s.opening==null||['D3','D4','D5'].some(g=>s.groups[g]==='Not Provided'))gaps.push([tr('30/90-Day Cash Forecast','التوقع النقدي ٣٠/٩٠ يومًا'),tr('Starting cash or scheduled collections/payments are missing.','النقد الابتدائي أو مواعيد التحصيل والدفع غير متاحة.')]);return `<div style="max-width:1010px;margin:23px auto;padding:0 17px"><div class="pagehead"><div><span class="eyebrow">${tr('FINANCIAL ONBOARDING','التهيئة المالية')}</span><h1>${tr('Financial Readiness','جاهزية البيانات المالية')}</h1><p class="muted">${tr('Review D1–D5 before entering Summary. A missing dataset is never silently counted as zero.','راجع D1–D5 قبل الدخول إلى الملخص. لا تُحتسب المجموعات الناقصة كصفر.')}</p></div>${badge('REVIEW','مراجعة','blue')}</div><div class="grid cols2"><div class="surface pad"><h3 style="margin-bottom:13px">${tr('Source coverage','تغطية البيانات')}</h3>${financialReadiness().map(x=>`<div class="statusrow"><span class="statusicon">${ico(x.status==='Needs Attention'?'alert':'check')}</span><div><strong>${x.g} — ${x.title}</strong><div class="muted tiny">${tr('Source status','حالة المصدر')}</div></div><span class="tag ${x.status==='Entered'||x.status==='Configured'?'good':x.status==='Needs Attention'?'bad':'warn'}">${tr(x.status,statusArabic(x.status))}</span></div>`).join('')}</div><div class="surface pad stack"><h3>${tr('Unavailable or limited KPIs','مؤشرات غير متاحة أو محدودة')}</h3>${gaps.length?gaps.map(([n,why])=>`<div class="callout warn"><b>${n}</b><div style="margin-top:4px">${why}</div></div>`).join(''):`<div class="callout good">${tr('Core fixture dependencies are available. Some historical or advanced charts may still require additional source history.','البيانات الأساسية التجريبية متاحة. قد تتطلب بعض الرسوم التاريخية معلومات إضافية.')}</div>`}<div class="callout">${tr('Entered means records exist, not necessarily that historical coverage is complete. A partially entered dataset does not prove a full-period KPI.','تم الإدخال تعني وجود سجلات ولا تعني بالضرورة اكتمال السجل التاريخي. البيانات الجزئية لا تكفي لإثبات مؤشر للفترة كلها.')}</div><div class="callout">${tr('Confirmed None means genuinely no records; Not Provided means unknown coverage. Neither represents an invented financial amount.','«مؤكد: لا يوجد» تعني عدم وجود سجلات فعليًا، أما «لم تُقدّم» فتعني تغطية مجهولة. كلاهما لا يبرر اختراع أرقام.')}</div><div class="buttonrow"><button class="btn" data-view="method">${tr('Add More Data','إضافة بيانات')}</button><button class="btn primary" data-action="goSummary">${tr('Go to Summary','الذهاب إلى الملخص')} ${ico('arrow')}</button></div></div></div></div>`}
const importDefs={tx:{title:['Transactions','الحركات النقدية'],fields:[['Date','Date','التاريخ'],['Direction','IN / OUT','دخول / خروج'],['Amount','Amount (JOD)','المبلغ (دينار)'],['Category','Category','الفئة'],['Description','Description','الوصف']]},ar:{title:['Customer Invoices','فواتير العملاء'],fields:[['Invoice','Invoice ID','رقم الفاتورة'],['Customer','Customer','العميل'],['Subtotal','Subtotal','المجموع قبل الضريبة'],['Due','Due Date','تاريخ الاستحقاق'],['Paid','Paid to Date','المدفوع حتى الآن'],['Expected','Expected Receipt','تاريخ التحصيل المتوقع']]},ap:{title:['Supplier Invoices','فواتير الموردين'],fields:[['Invoice','Invoice ID','رقم الفاتورة'],['Supplier','Supplier','المورد'],['Total','Total Amount','المبلغ الإجمالي'],['Due','Due Date','تاريخ الاستحقاق'],['Paid','Paid to Date','المدفوع حتى الآن'],['Expected','Expected Payment','تاريخ الدفع المتوقع']]}};
function canonicalConfidence(header,target){const a=header.toLowerCase().replace(/[^a-z]/g,''),b=target.toLowerCase().replace(/[^a-z]/g,'');if(a===b)return 98;if(a.includes(b)||b.includes(a))return 86;if((/amount|value|total/.test(a))&&(/amount|total|subtotal/.test(b)))return 74;if((/date|due|issued/.test(a))&&(/date|due/.test(b)))return 69;return 61}
function guessCanonical(header,type){const lower=header.toLowerCase();const aliases={tx:{Date:['date','bookingdate','transactiondate'],Direction:['inout','direction','type'],Amount:['amount','value','amountjod'],Category:['category','classification'],Description:['description','details','note']},ar:{Invoice:['invoiceid','invoice','number'],Customer:['customer','client'],Subtotal:['subtotal','netamount','amount'],Due:['due','duedate'],Paid:['paid','paidtodate'],Expected:['expectedreceipt','collectiondate','expected']},ap:{Invoice:['invoiceid','invoice','number'],Supplier:['supplier','vendor'],Total:['total','amount','gross'],Due:['due','duedate'],Paid:['paid','paidtodate'],Expected:['expectedpayment','settlementdate','expected']}};const norm=lower.replace(/[^a-z]/g,'');for(const [field,vals] of Object.entries(aliases[type]))if(vals.some(x=>norm===x||norm.includes(x)))return field;return ''}
function parseCSV(text){const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++}else quoted=!quoted;}else if(c===','&&!quoted){row.push(cell);cell=''}else if((c==='\r'||c==='\n')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(v=>v.trim()))rows.push(row);row=[];cell=''}else cell+=c;}row.push(cell);if(row.some(v=>v.trim()))rows.push(row);if(rows.length<2)return {headers:[],rows:[]};const headers=rows[0].map(x=>x.trim());return {headers,rows:rows.slice(1).map(cells=>Object.fromEntries(headers.map((h,i)=>[h,(cells[i]||'').trim()])))};}
function makeStage(type,name,text){const parsed=parseCSV(text);if(!parsed.headers.length)throw Error(tr('CSV must have headers and at least one row.','يجب أن يحتوي CSV على عناوين وصف واحد على الأقل.'));const mapping={};for(const h of parsed.headers)mapping[h]=guessCanonical(h,type);return {id:'file'+(s.import.files.length+1),type,name,headers:parsed.headers,rows:parsed.rows.map((raw,i)=>({id:'row'+i,raw:{...raw},override:{},reviewed:false,dupe:i===parsed.rows.length-1&&parsed.rows.length>=4?'potential':null,decision:null})),mapping};}
function demoCSV(type){const src=type==='tx'?FIX.tx.filter(x=>x.Date.startsWith('2026-10')).slice(0,4):type==='ar'?FIX.ar.filter(x=>x.Issue.startsWith('2026-10')).slice(0,3):FIX.ap.filter(x=>x.Issue.startsWith('2026-10')).slice(0,3);let hs=[],rows=[];if(type==='tx'){hs=['Transaction Date','Direction','Amount JOD','Category','Description'];rows=src.map(x=>[x.Date,x['IN/OUT'],x['Amount (JOD)'],x.Category,x.Description]);rows.push([...rows[0]])}if(type==='ar'){hs=['Invoice ID','Customer','Subtotal','Due','Paid to date','Expected receipt'];rows=src.map(x=>[x['Invoice ID'],x.Customer,x.Subtotal,x.Due,x['Paid to date'],x['Expected receipt']]);}if(type==='ap'){hs=['Invoice ID','Supplier','Total','Due','Paid to date','Expected payment'];rows=src.map(x=>[x['Invoice ID'],x.Supplier,x.Total,x.Due,x['Paid to date'],x['Expected payment']]);}if(type==='tx'&&rows[2])rows[2][2]='';return hs.join(',')+'\n'+rows.map(r=>r.map(x=>'"'+String(x||'').replace(/"/g,'""')+'"').join(',')).join('\n')}
function loadCSVSample(){s.import={step:0,files:[],tab:'tx',errors:[],validated:false,confirmed:false,result:'',aiDown:false};for(const type of ['tx','ar','ap'])s.import.files.push(makeStage(type,{tx:'oct_transactions.csv',ar:'oct_customer_invoices.csv',ap:'oct_supplier_bills.csv'}[type],demoCSV(type)));notify(tr('Loaded three illustrative CSV files. Review and resolve the deliberately highlighted issues.','تم تحميل ثلاثة ملفات تجريبية. راجع الأخطاء والتكرارات المحددة.'));render()}
function stageValue(file,row,field){if(Object.prototype.hasOwnProperty.call(row.override,field))return row.override[field];const header=Object.keys(file.mapping).find(h=>file.mapping[h]===field);return header?(row.raw[header]||''):''}

function importErrors(){const err=[];for(const f of s.import.files){const required=importDefs[f.type].fields.slice(0,f.type==='tx'?3:4).map(x=>x[0]);const mapped=Object.values(f.mapping);for(const field of required){if(!mapped.includes(field))err.push({file:f.id,row:null,field,msg:tr('Missing required field mapping','حقل مطلوب غير مطابق')+': '+field})}const counted=new Set();for(let i=0;i<f.rows.length;i++){let r=f.rows[i];if(r.decision==='exclude')continue;const vals=Object.fromEntries(importDefs[f.type].fields.map(([field])=>[field,stageValue(f,r,field)]));for(const field of required)if(!String(vals[field]||'').trim())err.push({file:f.id,row:i,field,msg:tr('Required field is empty','حقل مطلوب فارغ')});const amount=vals[f.type==='tx'?'Amount':f.type==='ar'?'Subtotal':'Total'];if(!isFinite(Number(String(amount||'').replace(/,/g,'')))||Number(String(amount||'').replace(/,/g,''))<=0)err.push({file:f.id,row:i,field:f.type==='tx'?'Amount':f.type==='ar'?'Subtotal':'Total',msg:tr('Amount must be positive','يجب أن يكون المبلغ موجبًا')});const dateVal=vals[f.type==='tx'?'Date':'Due'];if(!/^\d{4}-\d{2}-\d{2}$/.test(String(dateVal||'')))err.push({file:f.id,row:i,field:f.type==='tx'?'Date':'Due',msg:tr('Invalid date; use YYYY-MM-DD','تاريخ غير صحيح: استخدم YYYY-MM-DD')});if(f.type==='tx'&&!['IN','OUT'].includes(String(vals.Direction||'').toUpperCase()))err.push({file:f.id,row:i,field:'Direction',msg:tr('Direction must be IN or OUT','يجب تحديد دخول IN أو خروج OUT')});if(f.type!=='tx'&&parseNum(vals.Paid)>parseNum(amount))err.push({file:f.id,row:i,field:'Paid',msg:tr('Paid amount cannot exceed invoice amount','لا يجوز أن يتجاوز المدفوع قيمة الفاتورة')});const dupKey=f.type==='tx'?`${vals.Date}|${vals.Amount}|${vals.Direction}|${vals.Description}`:vals.Invoice;if(counted.has(dupKey)&&!r.dupe)r.dupe='exact';counted.add(dupKey);if(r.dupe&&!r.decision)err.push({file:f.id,row:i,field:'duplicate',msg:tr('Duplicate decision required','يجب حسم السجل المكرر')});if(f.type==='tx'&&!r.reviewed)err.push({file:f.id,row:i,field:'classification',msg:tr('Confirm proposed financial classification','أكد التصنيف المالي المقترح')});}}
return err}

function mappingRows(){return s.import.files.map(f=>`<div class="surface" style="box-shadow:none;margin-bottom:14px"><div class="row space" style="padding:13px 15px;border-bottom:1px solid var(--line)"><strong>${esc(f.name)}</strong>${badge(...importDefs[f.type].title,'blue')}</div><div class="tablewrap"><table><thead><tr><th>${tr('Original Header','العنوان الأصلي')}</th><th>${tr('Proposed Field (Editable)','الحقل المقترح (قابل للتعديل)')}</th><th>${tr('Confidence','الثقة')}</th><th>${tr('Example Value','قيمة نموذجية')}</th></tr></thead><tbody>${f.headers.map(h=>{const canon=f.mapping[h]||'',conf=canon?canonicalConfidence(h,canon):0;return `<tr><td class="mono">${esc(h)}</td><td><select class="table-select" aria-label="${tr('Mapping for','مطابقة')} ${esc(h)}" data-map="${f.id}" data-header="${esc(h)}"><option value="">${tr('Ignore / Unmapped','تجاهل / غير مطابق')}</option>${importDefs[f.type].fields.map(([field,en,ar])=>`<option value="${field}" ${canon===field?'selected':''}>${tr(en,ar)}</option>`).join('')}</select></td><td><span class="tag ${conf>=85?'good':conf>=70?'warn':'bad'} mono">${conf?conf+'%':tr('Manual','يدوي')}</span></td><td>${esc(f.rows[0]?.raw[h]||'—')}</td></tr>`}).join('')}</tbody></table></div></div>`).join('')}

function renderReview(){const files=s.import.files,tab=s.import.tab;let f=files.find(x=>x.type===tab)||files[0];const tabs=[...new Set(files.map(x=>x.type))];const errors=importErrors();const rowErrors=(file,row,field)=>errors.some(e=>e.file===file&&e.row===row&&e.field===field);return `<div class="stack"><div><h2>${tr('3. Editable financial review','٣. مراجعة مالية قابلة للتعديل')}</h2><p class="muted small">${tr('Edit cells, inspect highlighted errors, confirm classification and explicitly resolve duplicate rows.','عدّل الخلايا وراجع الأخطاء وأكّد التصنيفات واحسم الصفوف المكررة يدويًا.')}</p></div><div class="subtabs">${tabs.map(x=>`<button class="${f.type===x?'active':''}" data-import-tab="${x}">${tr(...importDefs[x].title)} <span class="tag">${files.filter(z=>z.type===x).reduce((n,z)=>n+z.rows.length,0)}</span></button>`).join('')}</div>${files.filter(x=>x.type===f.type).map(file=>`<div class="tablewrap"><div class="row space" style="margin-bottom:8px"><b>${esc(file.name)}</b><span class="small muted">${tr('Inline editing · Staged only','تعديل مباشر · بيانات مؤقتة')}</span></div><table><thead><tr><th>#</th>${importDefs[file.type].fields.map(([,en,ar])=>`<th>${tr(en,ar)}</th>`).join('')}${file.type==='tx'?`<th>${tr('AI Classification Review','مراجعة تصنيف AI')}</th>`:''}<th>${tr('Duplicate decision','قرار التكرار')}</th></tr></thead><tbody>${file.rows.map((r,i)=>`<tr style="${r.decision==='exclude'?'opacity:.5':''}"><td class="mono">${i+1}</td>${importDefs[file.type].fields.map(([field])=>`<td><input class="table-input ${rowErrors(file.id,i,field)?'bad':''}" aria-label="${field} ${i+1}" data-import-edit="${file.id}" data-row="${i}" data-field="${field}" value="${esc(stageValue(file,r,field))}">${rowErrors(file.id,i,field)?`<div class="error">${tr('Check value','تحقق من القيمة')}</div>`:''}</td>`).join('')}${file.type==='tx'?`<td><div class="stack" style="gap:4px;min-width:130px"><span class="tag blue">${tr('AI proposed · 88%','اقتراح AI · 88٪')}</span><label clas function renderConfirm(){const include=s.import.files.reduce((n,f)=>n+f.rows.filter(r=>r.decision!=='exclude').length,0),excluded=s.import.files.reduce((n,f)=>n+f.rows.filter(r=>r.decision==='exclude').length,0);return `<div class="stack"><h2>${tr('4. Confirm & Import','٤. تأكيد الاستيراد')}</h2><p class="muted small">${tr('Nothing is official until this confirmation. All eligible rows commit together or none do.','لن تُعد البيانات رسمية قبل التأكيد. تُعتمد كل الصفوف المؤهلة معًا أو لا يُعتمد أي منها.')}</p><div class="grid cols3"><div class="statbox"><div class="muted small">${tr('Staged files','الملفات المؤقتة')}</div><div class="metric mono">${s.import.files.length}</div></div><div class="statbox"><div class="muted small">${tr('Rows to import','الصفوف للاستيراد')}</div><div class="metric mono">${include}</div></div><div class="statbox"><div class="muted small">${tr('Explicitly excluded','مستبعدة بقرار المستخدم')}</div><div class="metric mono">${excluded}</div></div></div><div class="tablewrap"><table><thead><tr><th>${tr('Type','النوع')}</th><th>${tr('Included','المشمولة')}</th><th>${tr('Excluded','المستبعدة')}</th></tr></thead><tbody>${s.import.files.map(f=>`<tr><td>${esc(f.name)} · ${tr(...importDefs[f.type].title)}</td><td class="mono">${f.rows.filter(x=>x.decision!=='exclude').length}</td><td class="mono">${f.rows.filter(x=>x.decision==='exclude').length}</td></tr>`).join('')}</tbody></table></div><div class="callout warn">${tr('Financial rules: only transactions affect cash. Paid-to-date changes on invoices do not post cash. Import changes trigger a versioned metrics refresh.','قواعد مالية: الحركات النقدية وحدها تؤثر على الرصيد النقدي، وحالة سداد الفاتورة لا تنشئ حركة نقدية. يفعّل الاستيراد تحديثًا مرقمًا للمؤشرات.')}</div><label class="check"><input type="checkbox" id="confirmBatch" ${s.import.confirmed?'checked':''} data-change="confirmBatch"> ${tr('I reviewed all rows, classifications, exclusions and duplicate decisions.','راجعت جميع الصفوف والتصنيفات والا function renderImportResult(){const included=s.import.files.reduce((n,f)=>n+f.rows.filter(x=>x.decision!=='exclude').length,0);return `<div class="stack"><div class="row">${ico('check',30)}<h2>${tr('5. Import result','٥. نتيجة الاستيراد')}</h2>${badge('COMMITTED IN DEMO','تم الاعتماد تجريبيًا','good')}</div><p>${tr('The validated batch is now recorded in this browser-only company demo. No real server or financial system was changed.','أُضيفت المجموعة بعد التحقق إلى بيانات الشركة التجريبية داخل المتصفح. لم يتغير أي خادم أو نظام مالي حقيقي.')}</p><div class="grid cols3"><div class="statbox"><div class="muted small">${tr('Imported rows','الصفوف المستوردة')}</div><div class="metric mono">${included}</div></div><div class="statbox"><div class="muted small">${tr('Batch integrity','سلامة المجموعة')}</div><div class="metric">${tr('Atomic','كامل')}</div></div><div class="statbox"><div class="muted small">${tr('Metrics snapshot','نسخة المؤشرات')}</div><div class="metric mono">${esc(s.metric.version)}</div></div></div><div class="callout good">${tr('Imported data now appears in Financial Readiness. Missing D1–D5 groups remain Not Provided unless confirmed otherwise.','تظهر البيانات المستوردة في جاهزية البيانات. تبقى مجموعات D1–D5 غير المكتملة «لم تُقدّم» ما لم يؤكد المستخدم خلاف ذلك.')}</div><div class="buttonrow end"><button class="btn" data-action="newImport">${tr('Import Another File','استيراد ملف آخر')}</button><button class="btn primary" data-action="goReadiness">${tr('View Financial Readiness','عرض جاهزية البيانات')}</button></div></div>`}
function importCommit(){const errs=importErrors();if(errs.length||!s.import.validated||!s.import.confirmed){s.import.errors=errs;s.import.step=2;render();notify(tr('Import blocked: review errors or confirmation.','تعذر الاستيراد: راجع الأخطاء أو التأكيد.'));return;}for(const f of s.import.files){let rows=stagedData(f);if(f.type==='tx'){for(const x of rows)s.records.tx.push({ID:'DEMO-TX-'+(s.records.tx.length+1),Date:x.Date,'IN/OUT':x.Direction,'Amount (JOD)':x.Amount,'Cash-flow class':'Operating',Category:x.Category,Description:x.Description,_demo:true})}if(f.type==='ar'){for(const x of rows)s.records.ar.push({'Invoice ID':x.Invoice,Customer:x.Customer,Issue:x.Due,Due:x.Due,Subtotal:x.Subtotal,'Paid to date':x.Paid,'Gross total':x.Subtotal,Outstanding:String(parseNum(x.Subtotal)-parseNum(x.Paid)),'Expected receipt':x.Expected,_demo:true})}if(f.type==='ap'){for(const x of rows)s.records.ap.push({'Invoice ID':x.Invoice,Supplier:x.Supplier,Issue:x.Due,Due:x.Due,Total:x.Total,'Paid to date':x.Paid,Outstanding:String(parseNum(x.Total)-parseNum(x.Paid)),'Expected payment':x.Expected,_demo:true})}s.groups[{tx:'D2',ar:'D3',ap:'D4'}[f.type]]='Entered'}s.import.step=4;s.import.result='success';triggerMetrics();render();}
function txMonthly(month){const rows=s.records.tx.filter(x=>x.Date&&x.Date.startsWith(month));let inflow=0,outflow=0,operating=0;for(const r of rows){const n=parseNum(r['Amount (JOD)']);if(r['IN/OUT']==='IN'){inflow+=n;if(r['Cash-flow class']==='Operating')operating+=n}else{outflow+=n;if(r['Cash-flow class']==='Operating')operating-=n}}return {inflow,outflow,net:inflow-outflow,operating};}
function metricsForPeriod(){if(s.metric.updating)return null;const hasCash=s.opening!=null&&(s.demoFull||s.groups.D2==='Confirmed None');let cash=null;if(hasCash){cash=s.opening+s.records.tx.filter(x=>x.Date&&x.Date<='2026-11-06').reduce((sum,r)=>sum+(r['IN/OUT']==='IN'?1:-1)*parseNum(r['Amount (JOD)']),0);}const isDemo=s.demoFull;const knownFlow=s.demoFull||s.groups.D2==='Confirmed None';const period=s.period;let fin=period==='2025'?{revenue:FIX.hist.filter(x=>x.Month.startsWith('2025-')).reduce((n,x)=>n+parseNum(x.Revenue),0),expenses:FIX.hist.filter(x=>x.Month.startsWith('2025-')).reduce((n,x)=>n+parseNum(x['Recognized expenses']),0),profit:FIX.hist.filter(x=>x.Month.startsWith('2025-')).reduce((n,x)=>n+parseNum(x['Net profit']),0)}:(()=>{const h=FIX.hist.find(x=>x.Month===period);return {revenue:parseNum(h?.Revenue),expenses:parseNum(h?.['Recognized expenses']),profit:parseNum(h?.['Net profit'])}})();let flow=period==='2025'?s.records.tx.filter(x=>x.Date?.startsWith('2025-')).reduce((a,x)=>{const n=parseNum(x['Amount (JOD)']);if(x['IN/OUT']==='IN')a.inflow+=n;else a.outflow+=n;a.net=a.inflow-a.outflow;return a},{inflow:0,outflow:0,net:0}):txMonthly(period);return {cash,received:knownFlow?flow.inflow:null,paid:knownFlow?flow.outflow:null,net:knownFlow?flow.net:null,revenue:isDemo?fin.revenue:null,profit:isDemo?fin.profit:null,expenses:isDemo?fin.expenses:null,runway:isDemo?1.54:null,scope:s.period==='2025'?'2025':s.period};}
function snapshotStamp(){return `<div class="row wrap small muted" style="gap:8px">${ico('refresh',14)} <span>${s.metric.updating?`<strong>${tr('Updating metrics…','جارٍ تحديث المؤشرات…')}</strong>`:`${tr('Last calculated at','آخر احتساب في')} <span class="mono">${esc(s.metric.time)}</span>`}</span><span class="tag outline mono">${esc(s.metric.version)}</span><span title="${tr('Daily snapshot recalculation is part of the product specification; this offline file simulates recalculation after local saves.','التحديث اليومي جزء من مواصفات المنتج، ويحاكي هذا الملف التحديث بعد الحفظ المحلي.')}" class="tag outline">${tr('Daily + on commit','يوميًا وعند الحفظ')}</span><span class="tag good">${tr('OFFICIAL','رسمي')}</span></div>`}
function triggerMetrics(){s.metric.updating=true;const prev=s.metric.version;const v=Number(prev.match(/(\d+)$/)?.[1]||0);setTimeout(()=>{s.metric.updating=false;s.metric.version='v1.0.'+(v+1);s.metric.time='2026-11-06 18:'+String((v+1)%60).padStart(2,'0')+' · demo';render();notify(tr('Versioned metrics snapshot refreshed (browser demo).','تم تحديث نسخة المؤشرات المالية التجريبية.'))},1050);}

case'ar-aging':case'ap-aging':{const kind=subject==='ar-aging'?'ar':'ap',date=new Date('2026-11-06T00:00:00Z'), buckets=[0,0,0,0,0];for(const x of s.records[kind]){const due=new Date((x.Due||'2026-11-06')+'T00:00:00Z'),remaining=kind==='ar'?parseNum(x.Outstanding):parseNum(x.Outstanding);if(remaining<=0||!Number.isFinite(due.getTime()))continue;const age=Math.round((date-due)/86400000);buckets[age<=0?0:age<=30?1:age<=60?2:age<=90?3:4]+=remaining;}return chart([tr('Not due','غير مستحق'),tr('1–30d','١–٣٠ يوم'),tr('31–60d','٣١–٦٠ يوم'),tr('61–90d','٦١–٩٠ يوم'),tr('90+d','٩٠+ يوم')],[{name:tr('Outstanding','المستحق'),data:buckets,color:'#c27d5a'}],'bar');}

function svgChart(data,title){if(data.unavailable)return `<div class="empty" style="margin-top:10px">${ico('alert',24)}<h3>${tr('Insufficient Data','بيانات غير كافية')}</h3><p>${esc(data.unavailable)}</p></div>`;const labels=data.labels,series=data.series,n=labels.length,w=740,h=236,margin={l:56,r:12,t:17,b:50};const all=series.flatMap(x=>x.data).filter(Number.isFinite),max=Math.max(1,...all),min=Math.min(0,...all);const pad=(max-min)*.12||1,hi=max+pad,lo=Math.min(0,min-pad),plotW=w-margin.l-margin.r,plotH=h-margin.t-margin.b;const X=i=>margin.l+(n===1?plotW/2:i*plotW/Math.max(1,n-1)),Y=v=>margin.t+(hi-v)/(hi-lo)*plotH;const yticks=Array.from({length:4},(_,i)=>lo+(hi-lo)*i/3);let shapes='';if(data.kind==='bar'){const groupW=plotW/Math.max(1,n),width=Math.min(28,groupW/Math.max(1,series.length+1));series.forEach((se,si)=>se.data.forEach((v,i)=>{const cx=margin.l+groupW*(i+.5)+(si-(series.length-1)/2)*(width+3),top=Y(Math.max(v,0)),bot=Y(Math.min(v,0));shapes+=`<rect x="${cx-width/2}" y="${Math.min(top,bot)}" width="${width}" height="${Math.max(1,Math.abs(bot-top))}" rx="3" fill="${se.color}" opacity=".91"><title>${esc(labels[i])}: ${nf(v,2)} ${data.suffix}</title></rect>`}));}else{series.forEach(se=>{shapes+=`<polyline points="${se.data.map((v,i)=>X(i)+','+Y(v)).join(' ')}" fill="none" stroke="${se.color}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`;se.data.forEach((v,i)=>shapes+=`<circle cx="${X(i)}" cy="${Y(v)}" r="4" fill="#fff" stroke="${se.color}" stroke-width="2.5"><title>${esc(labels[i])}: ${nf(v,2)} ${data.suffix}</title></circle>`)});}
return `<div class="chartarea" role="img" aria-label="${esc(title)}"><svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><title>${esc(title)}</title><desc>${esc(series.map(x=>x.name+': '+x.data.map(n=>nf(n)).join(', ')).join('; '))}</desc>${yticks.map(v=>`<line x1="${margin.l}" x2="${w-margin.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="#e8edf5" stroke-width="1"/><text x="${margin.l-10}" y="${Y(v)+3}" text-anchor="end" font-size="11" fill="#738398">${Math.abs(v)>=1000?(v/1000).toFixed(1)+'k':nf(v,0)}${data.suffix==='%'?'%':''}</text>`).join('')}${shapes}${labels.map((l,i)=>`<text x="${data.kind==='bar'?margin.l+plotW/Math.max(1,n)*(i+.5):X(i)}" y="${h-24}" text-anchor="middle" font-size="10.5" fill="#718199">${esc(String(l).length>14?String(l).slice(0,12)+'…':l)}</text>`).join('')}<line x1="${margin.l}" x2="${w-margin.r}" y1="${Y(0)}" y2="${Y(0)}" stroke="#b6c4d7" stroke-width="1.3"/></svg></div><div class="legend">${series.map(se=>`<span><i style="background:${se.color}"></i>${esc(se.name)}</span>`).join('')}</div>`;}
function chartSlot(slot){let id=s.chartSlots[s.role][slot];const data=chartData(id);return `<div class="surface chartcard"><div class="chart-head"><div><div class="row wrap">${badge('OFFICIAL','رسمي','good')}<span class="small muted">${slot+1} / 3</span></div><h3 style="margin-top:7px">${labelSubject(id)}</h3></div><button class="btn sm" data-action="changeChart" data-slot="${slot}">${ico('sliders')} ${tr('Change Chart','تغيير الرسم')}</button></div>${s.metric.updating?`<div class="stack" style="margin-top:20px"><div class="loading-line" style="height:20px;width:55%"></div><div class="loading-line" style="height:155px"></div><span class="small muted">${tr('Updating metrics…','جارٍ تحديث المؤشرات…')}</span></div>`:svgChart(data,labelSubject(id))}<p class="chart-hint">${id==='cash-forecast'?tr('Forecast horizon: official 30/90-day event series; not affected by historical period filter.','أفق التنبؤ: سلسلة أحداث رسمية لمدة ٣٠/٩٠ يومًا، لا تتأثر بمرشح الفترات التاريخية.'):tr('Historical and as-of measures are labeled by their financial definition.','تظهر الفترة والتاريخ المرجعي حسب تعريف كل مؤشر مالي.')}</p></div>`}

else if(page==='forecast')body+=`<div class="surface pad stack">${badge('OFFICIAL','رسمي','good')}<h3>${tr('30/90-Day Forecast Highlights','ملخص التنبؤ النقدي ٣٠/٩٠ يومًا')}</h3><div class="grid cols3">${[[tr('30-day ending','رصيد ٣٠ يومًا'),9010],[tr('90-day ending','رصيد ٩٠ يومًا'),-1390],[tr('First shortage','أول عجز'),'2027-01-30']].map(([k,v])=>`<div class="statbox"><div class="muted small">${k}</div><div class="metric">${s.demoFull?(typeof v==='number'?amt(v):`<span class="mono">${v}</span>`):tr('Insufficient Data','بيانات غير كافية')}</div></div>`).join('')}</div><p class="muted small">${tr('Full assumptions editing remains outside this screen round; authority over official assumptions is marked open in the specification.','تعديل جميع الافتراضات خارج نطاق الجولة الحالية، وصلاحية تغيير الافتراضات الرسمية ما زالت قرارًا مفتوحًا في المواصفات.')}</p></div>`;

}}
function updateStrength(v){const bar=$('#strengthBar'),text=$('#strengthText');if(!bar)return;let points=(v.length>=8?1:0)+(/[a-z]/.test(v)?1:0)+(/[A-Z]/.test(v)?1:0)+(/[0-9]/.test(v)?1:0)+(/[\W_]/.test(v)?1:0);bar.style.width=points*20+'%';bar.style.background=points<=2?'#cd5366':points<=3?'#db9646':'#188367';text.textContent=points<=1?tr('Weak','ضعيفة'):points<=3?tr('Fair','متوسطة'):tr('Strong','قوية')}
function change(el){const d=el.dataset;if(d.change==='role'){s.role=el.value;navTo(can('summary')?'summary':s.role==='admin'?'team':'profile');return}if(d.change==='period'){s.period=el.value;render();return}if(d.change==='cashUnknown'){s.cashUnknown=el.checked;const fields=$('#cashFields'),note=$('#unknownNote');if(fields)fields.style.display=el.checked?'none':'grid';if(note)note.textContent=el.checked?tr('Opening cash: Unknown. Current Cash and forecasts may show Insufficient Data.','الرصيد الافتتاحي: غير معروف. قد تظهر مؤشرات النقد والتنبؤات ببيانات غير كافية.'):tr('Enter a known opening amount and its effective date.','أدخل رصيدًا افتتاحيًا معروفًا وتاريخه.');return}if(d.map){const file=s.import.files.find(x=>x.id===d.map);if(file){file.mapping[d.header]=el.value;s.import.validated=false;s.import.errors=[];render()}return}if(d.confirmClass){const file=s.import.files.find(f=>f.id===d.confirmClass);if(file){file.rows[Number(d.row)].reviewed=el.checked;s.import.validated=false;s.import.errors=[];render();}return}if(d.importEdit){const file=s.import.files.find(f=>f.id===d.importEdit);if(file){file.rows[Number(d.row)].override[d.field]=el.value;s.import.validated=false;s.import.errors=[];}return}if(d.dupe){const file=s.import.files.find(f=>f.id===d.dupe);if(file){file.rows[Number(d.row)].decision=el.value||null;s.import.validated=false;s.import.errors=[];render();}return}if(d.change==='confirmBatch'){s.import.confirmed=el.checked;render();return}if(d.grant){s.roleGrants[d.grant][d.module]=el.value==='none'?null:el.value;render();notify(tr('Demo access updated and role navigation recalculated.','تم تحديث الصلاحية التجريبية وإعادة احتساب القائمة.'));return}}
function clickAction(e){const btn=e.target.closest('button,[data-action],[data-drill],[data-kpi],[data-record-detail]');if(!btn)return;const d=btn.dataset;if(d.action){if(d.action==='backdropClose'&&e.target!==btn)return;action(d.action,btn);return}if(d.view){navTo(d.view);return}if(d.importTab){s.import.tab=d.importTab;render();return}if(d.kpi){drawerForKpi(d.kpi);return}if(d.drawer){openContextDrawer(d.drawer);return}if(d.drill){if(!can(d.drill))return notify(tr('Permission denied for destination.','لا تملك صلاحية فتح الوجهة.'));navTo(d.drill);return}if(d.recordDetail){recordDrawer(d.recordDetail,Number(d.index));return}}
function handleInput(e){if(e.target.id==='password')updateStrength(e.target.value);if(e.target.id==='fullName')s.name=e.target.value;if(e.target.id==='workEmail')s.email=e.target.value;}
document.addEventListener('click',clickAction);document.addEventListener('change',e=>change(e.target));document.addEventListener('input',handleInput);document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;if(f.id==='recordForm')handleRecordSave(f);else handlePublicForm(f)});document.addEventListener('keydown',e=>{if(e.key==='Tab'&&(s.modal||s.drawer)){const dialog=$('#overlayRoot [role=dialog]');if(dialog){const focusables=$$('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex="0"]',dialog);if(focusables.length){if(e.shiftKey&&document.activeElement===focusables[0]){e.preventDefault();focusables.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===focusables.at(-1)){e.preventDefault();focusables[0].focus()}}}}if(e.key==='Escape'&&(s.modal||s.drawer)){s.modal=null;s.drawer=null;render()}if(e.key==='Escape'&&s.mobileNav){s.mobileNav=false;render()}});$('#mobileBackdrop').addEventListener('click',()=>{s.mobileNav=false;render()});
render();
</script></body></html>
