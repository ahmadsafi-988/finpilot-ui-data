<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FinPilot AI Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F2ED; --surface:#FFFFFF; --surface-2:#FAF8F4; --ink:#14212B; --ink-2:#3E4C56; --muted:#5F6B74;
  --line:#E2DDD3; --line-2:#EEEAE3;
  --brand:#0F5257; --brand-2:#136A70; --brand-soft:#E2EFEE; --brand-ink:#0B3D41;
  --c1:#0F5257; --c2:#C7893A; --c3:#7C93A0;
  --pos:#1D7349; --pos-soft:#E4F2E9; --neg:#B0362D; --neg-soft:#FBE9E6;
  --warn:#94600F; --warn-soft:#FBF0DC; --info:#2C5A86; --info-soft:#E6EEF7;
  --hypo:#8A5A12; --hypo-soft:#FFF5E3;
  --r:12px; --r-sm:8px;
  --shadow:0 1px 2px rgba(20,33,43,.05),0 6px 20px rgba(20,33,43,.05);
  --shadow-lg:0 12px 40px rgba(20,33,43,.18);
  --font:'IBM Plex Sans','IBM Plex Sans Arabic',system-ui,-apple-system,Segoe UI,sans-serif;
  color-scheme:light;
}
[dir=rtl]{--font:'IBM Plex Sans Arabic','IBM Plex Sans',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5}
body{min-height:100vh}
button,input,select{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;line-height:1.25;font-weight:600}
h1{font-size:28px;letter-spacing:-.01em} h2{font-size:20px} h3{font-size:16px} h4{font-size:14px}
p{margin:0}
a{color:var(--brand-2)}
.num{font-variant-numeric:tabular-nums;unicode-bidi:isolate;white-space:nowrap}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
.ic{flex:none;vertical-align:middle}
[dir=rtl] .flip{transform:scaleX(-1)}
:focus-visible{outline:3px solid #2F7F86;outline-offset:2px;border-radius:6px}
.onb>*,.shell>*{min-width:0}
#main:focus{outline:none}
.tbl td.wide-c input{min-width:190px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:9px;cursor:pointer;font-weight:500;font-size:14px;line-height:1.2;text-decoration:none;color:var(--ink);transition:background .15s,border-color .15s}
.btn:hover{background:var(--surface-2);border-color:#cfc8bb}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-2)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:rgba(15,82,87,.07)}
.btn.danger{color:var(--neg);border-color:#e7c3be}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.lg{padding:12px 20px;font-size:15px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--brand-2);cursor:pointer;font-weight:500;text-decoration:underline;text-underline-offset:3px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

/* pills & badges */
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:500;border:1px solid transparent;white-space:nowrap}
.p-period{background:var(--surface-2);border-color:var(--line);color:var(--ink-2)}
.p-asof{background:var(--info-soft);color:var(--info)}
.p-asof::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-fc{background:#EFEAF6;color:#5A3F86}
.p-ok{background:var(--pos-soft);color:var(--pos)} .p-bad{background:var(--neg-soft);color:var(--neg)}
.p-warn{background:var(--warn-soft);color:var(--warn)} .p-info{background:var(--info-soft);color:var(--info)}
.p-neutral{background:var(--line-2);color:var(--ink-2)}
.badge-official{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.08em;color:#fff;background:var(--brand);padding:3px 8px;border-radius:5px}
.badge-hypo{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--hypo);background:var(--hypo-soft);border:1.5px dashed #D9A55A;padding:2px 8px;border-radius:5px}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 16px 0;flex-wrap:wrap}
.card-b{padding:14px 16px 16px}
.sec-title{display:flex;align-items:center;gap:10px;margin:28px 0 12px;flex-wrap:wrap}
.sec-title .n{font-size:12px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 7px}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:13px;font-weight:500;color:var(--ink-2)}
.field input,.field select{border:1px solid #CFC8BC;background:#fff;border-radius:9px;padding:10px 12px;min-height:42px;width:100%}
.field input:disabled{background:var(--line-2);color:var(--muted)}
.field input:focus,.field select:focus{border-color:var(--brand-2);outline:3px solid rgba(19,106,112,.18);outline-offset:0}
.field.has-err input,.field.has-err select{border-color:var(--neg);background:#FFFBFA}
.err{color:var(--neg);font-size:13px;display:flex;gap:6px;align-items:flex-start}
.hint{color:var(--muted);font-size:12.5px}
.req{color:var(--neg)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer}
.check input{width:18px;height:18px;margin-top:2px;accent-color:var(--brand)}
.placeholder-box{border:1.5px dashed #C9C1B3;border-radius:10px;padding:10px 12px;background:repeating-linear-gradient(135deg,#fbfaf7,#fbfaf7 8px,#f5f2ec 8px,#f5f2ec 16px);font-size:13px;color:var(--ink-2)}
.ph-label{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--warn);text-transform:uppercase}

/* notices */
.note{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:10px;font-size:13.5px;border:1px solid}
.note.info{background:var(--info-soft);border-color:#c9d9ea;color:#1f466c}
.note.warn{background:var(--warn-soft);border-color:#ecd3a5;color:#6d470b}
.note.bad{background:var(--neg-soft);border-color:#efc4be;color:#842821}
.note.ok{background:var(--pos-soft);border-color:#bfe0cc;color:#155535}
.note.hypo{background:var(--hypo-soft);border-color:#e8c78f;border-style:dashed;color:#6d470b}

/* landing */
.land{min-height:100vh;display:flex;flex-direction:column}
.land-top{display:flex;align-items:center;gap:12px;padding:18px 32px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;color:var(--brand-ink)}
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center;padding:40px 32px 56px;max-width:1200px;margin:0 auto;width:100%}
.hero h1{font-size:44px;line-height:1.1;letter-spacing:-.02em;color:var(--brand-ink)}
[dir=rtl] .hero h1{letter-spacing:0;line-height:1.3}
.hero p.lead{font-size:18px;color:var(--ink-2);margin:18px 0 28px;max-width:540px}
.vps{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:1200px;margin:0 auto;padding:0 32px 48px;width:100%}
.vp{padding:18px}
.vp h3{margin:8px 0 4px}
.land-foot{margin-top:auto;padding:18px 32px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap}

/* onboarding */
.onb{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:100vh}
.onb-side{background:var(--brand-ink);color:#DCEBEA;padding:28px 26px;display:flex;flex-direction:column;gap:28px}
.onb-side .brand{color:#fff}
.stepper{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.stepper li{display:flex;gap:12px;align-items:center;padding:8px 10px;border-radius:9px;font-size:14px;color:#9FC1BF}
.stepper li .sn{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:1.5px solid #4D7C7F;font-size:12px;font-weight:600}
.stepper li.done{color:#DCEBEA}.stepper li.done .sn{background:#2E8A86;border-color:#2E8A86;color:#fff}
.stepper li.cur{background:rgba(255,255,255,.08);color:#fff;font-weight:600}.stepper li.cur .sn{background:#fff;color:var(--brand-ink);border-color:#fff}
.onb-note{font-size:13px;color:#9FC1BF;margin-top:auto}
.onb-main{display:flex;flex-direction:column;min-width:0}
.onb-top{display:flex;justify-content:flex-end;gap:8px;padding:16px 24px}
.onb-body{width:100%;max-width:640px;margin:0 auto;padding:12px 24px 80px}
.onb-body.wide{max-width:1040px}
.onb-body h1{margin-bottom:6px}
.onb-body .sub{color:var(--ink-2);margin-bottom:24px}
.pw-meter{display:flex;gap:4px;margin-top:2px}
.pw-meter span{flex:1;height:5px;border-radius:3px;background:var(--line)}
.pw-meter.s1 span:nth-child(-n+1){background:var(--neg)}
.pw-meter.s2 span:nth-child(-n+2){background:var(--warn)}
.pw-meter.s3 span:nth-child(-n+3){background:#5D9C59}
.pw-meter.s4 span{background:var(--pos)}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.choice .card{padding:22px;cursor:pointer;text-align:start;border-width:1.5px;display:flex;flex-direction:column;gap:10px}
.choice .card:hover{border-color:var(--brand-2)}
.ico-tile{width:42px;height:42px;border-radius:10px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center}

/* wizard */
.wz{display:flex;gap:6px;margin:4px 0 22px;flex-wrap:wrap}
.wz span{font-size:12.5px;padding:5px 11px;border-radius:99px;background:var(--line-2);color:var(--muted);font-weight:500}
.wz span.cur{background:var(--brand);color:#fff}.wz span.done{background:var(--brand-soft);color:var(--brand)}
.drop{border:2px dashed #C3BCAF;border-radius:var(--r);padding:28px;text-align:center;background:var(--surface-2);cursor:pointer;width:100%}
.drop:hover{border-color:var(--brand-2)}
table{border-collapse:collapse;width:100%}
.tbl{font-size:13.5px}
.tbl th{text-align:start;font-weight:600;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em;padding:9px 10px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
[dir=rtl] .tbl th{letter-spacing:0;text-transform:none}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line-2);vertical-align:top}
.tbl tr.r-err td{background:#FDF3F1}
.tbl tr.r-dup td{background:#FDF8EC}
.tbl input,.tbl select{border:1px solid #D8D1C5;border-radius:7px;padding:6px 8px;width:100%;min-width:90px;background:#fff;font-size:13.5px}
.tbl tr.r-err input.bad{border-color:var(--neg);background:#fff8f7}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:#fff}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--brand);border-bottom-color:var(--brand)}
.conf{display:inline-flex;align-items:center;gap:6px;font-size:12.5px}
.conf i{display:inline-block;width:44px;height:5px;border-radius:3px;background:var(--line);position:relative;overflow:hidden}
.conf i b{position:absolute;inset-block:0;inset-inline-start:0;background:var(--pos)}
.conf.low i b{background:var(--warn)}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat{padding:14px 16px}
.stat .v{font-size:24px;font-weight:600;margin-top:4px}

/* readiness */
.rd-list{display:flex;flex-direction:column;gap:10px}
.rd{display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;padding:14px 16px}
.rd .code{font-weight:700;color:var(--brand);background:var(--brand-soft);border-radius:9px;text-align:center;padding:8px 0;font-size:14px}

/* shell */
.shell{display:grid;grid-template-columns:262px 1fr;min-height:100vh}
.sidebar{background:var(--surface);border-inline-end:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar .brand{padding:6px 10px 16px}
.nav-g{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:14px 10px 6px}
[dir=rtl] .nav-g{letter-spacing:0}
.nav-i{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;border:0;background:none;cursor:pointer;width:100%;text-align:start;color:var(--ink-2);font-size:14px}
.nav-i:hover{background:var(--surface-2)}
.nav-i[aria-current=page]{background:var(--brand-soft);color:var(--brand);font-weight:600}
.nav-i.sub{padding-inline-start:36px;font-size:13.5px}
.side-foot{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--line-2);font-size:12.5px;color:var(--muted)}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;background:rgba(244,242,237,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 24px;flex-wrap:wrap}
.topbar .co{font-weight:600}
.topbar .pg{color:var(--muted)}
.tb-sel{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 8px;font-size:13px}
.iconbtn{position:relative;width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer}
.iconbtn .dot{position:absolute;top:5px;inset-inline-end:5px;min-width:16px;height:16px;border-radius:8px;background:var(--neg);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:600;font-size:13px}
.menu-wrap{position:relative}
.menu{position:absolute;top:calc(100% + 6px);inset-inline-end:0;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-lg);min-width:230px;padding:6px;z-index:40}
.menu button{display:flex;width:100%;gap:10px;align-items:center;padding:8px 10px;border:0;background:none;border-radius:7px;cursor:pointer;text-align:start;font-size:14px}
.menu button:hover{background:var(--surface-2)}
.content{padding:22px 24px 120px;max-width:1280px;width:100%;margin:0 auto}
.page-h{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.hamb{display:none}

/* snapshot bar */
.snap{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:13px;color:var(--ink-2);margin:12px 0 4px}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--brand-soft);border-top-color:var(--brand);animation:sp 0.8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.kpi{padding:16px;cursor:pointer;text-align:start;display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);background:#fff;border-radius:var(--r);box-shadow:var(--shadow);position:relative;width:100%}
.kpi:hover{border-color:#bfb7a8}
.kpi .lbl{display:flex;gap:8px;align-items:center;justify-content:space-between;font-size:13.5px;color:var(--ink-2);font-weight:500;flex-wrap:wrap}
.kpi .val{font-size:28px;font-weight:600;letter-spacing:-.01em}
.kpi .val.neg{color:var(--neg)}
.kpi .foot{font-size:12.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.kpi.busy::after{content:"";position:absolute;inset:0;border-radius:var(--r);background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.65) 50%,transparent 70%);background-size:200% 100%;animation:sh 1.2s infinite}
.kpi .insuf{font-size:17px;font-weight:600;color:var(--warn);display:flex;gap:6px;align-items:center}
.delta-up{color:var(--pos)} .delta-dn{color:var(--neg)}
.kpis.k4{grid-template-columns:repeat(4,1fr)}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.charts .full{grid-column:1/-1}
.chart-card .ch-h{display:flex;align-items:flex-start;gap:8px;flex-wrap:wrap;padding:14px 16px 4px}
.chart-card .ch-h h3{flex:1;min-width:160px}
.chart-svg{width:100%;height:auto;display:block}
.chart-svg .grid{stroke:var(--line-2)} .chart-svg .zero{stroke:#9aa5ad;stroke-dasharray:4 3}
.chart-svg .thr{stroke:var(--warn);stroke-dasharray:5 4}
.chart-svg text{font-size:11px;fill:var(--muted);font-family:var(--font)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);padding:0 16px 6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px;vertical-align:-1px}
.hbars{display:flex;flex-direction:column;gap:9px;padding:6px 0}
.hb{display:grid;grid-template-columns:minmax(110px,34%) 1fr auto;gap:10px;align-items:center;font-size:13px}
.hb .track{height:12px;background:var(--line-2);border-radius:6px;overflow:hidden}
.hb .bar{height:100%;background:var(--c1);border-radius:6px}
details.data{padding:0 16px 12px;font-size:12.5px}
details.data summary{cursor:pointer;color:var(--brand-2);font-weight:500}
.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mini{padding:14px 16px}
.mini .v{font-size:22px;font-weight:600;margin:2px 0}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line-2);font-size:13.5px}
.list li:last-child{border-bottom:0}
.sev{width:8px;height:8px;border-radius:50%;flex:none}
.sev.high{background:var(--neg)} .sev.med{background:var(--warn)} .sev.low{background:var(--info)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:5px 11px;font-size:13px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--brand);color:#fff}
.ai-card{background:linear-gradient(135deg,#F2F8F7,#FFFFFF 60%);}
.skel{background:linear-gradient(100deg,#ece8e1 30%,#f6f3ee 50%,#ece8e1 70%);background-size:200% 100%;animation:sh 1.3s infinite;border-radius:8px}
@keyframes sh{to{background-position:-200% 0}}
.empty{text-align:center;padding:30px 18px;display:flex;flex-direction:column;align-items:center;gap:10px}
.denied{max-width:560px;margin:60px auto;text-align:center;padding:36px 28px;display:flex;flex-direction:column;gap:12px;align-items:center}
.lock{width:56px;height:56px;border-radius:14px;background:var(--line-2);display:grid;place-items:center;color:var(--ink-2)}

/* overlays */
.scrim{position:fixed;inset:0;background:rgba(20,33,43,.38);z-index:60;animation:fd .15s}
@keyframes fd{from{opacity:0}}
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(520px,100vw);background:#fff;z-index:61;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;animation:sl .2s ease-out}
@keyframes sl{from{transform:translateX(30px);opacity:.4}}
[dir=rtl] .drawer{animation-name:slr}
@keyframes slr{from{transform:translateX(-30px);opacity:.4}}
.dr-h{display:flex;align-items:flex-start;gap:10px;padding:18px 20px;border-bottom:1px solid var(--line)}
.dr-b{padding:18px 20px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:16px}
.dr-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.modal{position:fixed;inset:0;z-index:61;display:grid;place-items:center;padding:20px;pointer-events:none}
.modal .box{pointer-events:auto;background:#fff;border-radius:16px;box-shadow:var(--shadow-lg);width:min(640px,100%);max-height:calc(100vh - 40px);display:flex;flex-direction:column;animation:pop .18s ease-out}
.modal .box.wide{width:min(920px,100%)}
@keyframes pop{from{transform:scale(.97);opacity:.5}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:end}
.bridge{font-size:13.5px}
.bridge td{padding:6px 0;border-bottom:1px solid var(--line-2)}
.bridge td:last-child{text-align:end}
.bridge tr.tot td{font-weight:600;border-top:1.5px solid var(--ink);border-bottom:0}
.formula{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;direction:ltr;text-align:left}
.lib-cat{margin-bottom:16px}
.lib-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}
.lib-item{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;cursor:pointer;text-align:start;font-size:13.5px}
.lib-item:hover{border-color:var(--brand-2)}
.lib-item[aria-current=true]{border-color:var(--brand);background:var(--brand-soft)}

/* toasts & dev */
.toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(560px,92vw)}
.toast{background:var(--ink);color:#fff;padding:11px 16px;border-radius:10px;font-size:14px;box-shadow:var(--shadow-lg);display:flex;gap:10px;align-items:center;pointer-events:auto}
.dev{position:fixed;bottom:16px;inset-inline-end:16px;z-index:70;font-size:13px}
.dev-pill{background:#2A2F36;color:#fff;border:0;border-radius:99px;padding:8px 14px;cursor:pointer;font-weight:500;display:flex;gap:8px;align-items:center;box-shadow:var(--shadow-lg)}
.dev-panel{background:#2A2F36;color:#E8EAED;border-radius:14px;padding:14px;width:290px;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;gap:10px;max-height:80vh;overflow:auto}
.dev-panel label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:#AEB4BC}
.dev-panel select{background:#3A4049;border:1px solid #4B525C;color:#fff;border-radius:7px;padding:6px 8px}
.dev-panel .tg{flex-direction:row;align-items:center;gap:8px;color:#E8EAED;font-size:13px}
.dev-panel button.d{background:#3A4049;color:#fff;border:1px solid #4B525C;border-radius:7px;padding:7px 10px;cursor:pointer;text-align:start}
.gal{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.gal .card{padding:16px;display:flex;flex-direction:column;gap:10px}
.gal h4{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em}

@media (max-width:1100px){.kpis,.kpis.k4{grid-template-columns:repeat(2,1fr)}.cols3{grid-template-columns:1fr 1fr}}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .sidebar{position:fixed;inset-block:0;inset-inline-start:0;width:280px;z-index:65;transform:translateX(-105%);transition:transform .2s;box-shadow:var(--shadow-lg)}

  .hero{grid-template-columns:1fr;gap:28px;padding:24px 16px}

  .vps{grid-template-columns:1fr;padding:0 16px 32px}
  .land-top{padding:14px 16px}
  .content{padding:16px 16px 120px}
  .topbar{padding:10px 16px}
  .topbar .hide-m{display:none}
}
@media (max-width:600px){
  .kpis,.kpis.k4{grid-template-columns:1fr}

  .rd{grid-template-columns:44px 1fr}

  .onb-body{padding:8px 16px 90px}
}

 else c=`<input id="${id}" type="${o.type||'text'}" value="${esc(o.value)}" ${o.dis?'disabled':''} oninput="${o.on}" ${o.attrs||''} ${inv} ${o.ac?`autocomplete="${o.ac}"`:''}>`;

function pwScore(p){let s=0;if(p.length>=8)s++;if(/[A-Z]/.test(p)&&/[a-z]/.test(p))s++;if(/\d/.test(p))s++;if(/[^A-Za-z0-9]/.test(p)||p.length>=12)s++;return p?Math.max(1,s):0}
const PWL=[['',''],['Weak','ضعيفة'],['Fair','مقبولة'],['Good','جيدة'],['Strong','قوية']];
function pwInput(v){S.reg.pw=v;const s=pwScore(v);const m=$('#pwm');if(m){m.className='pw-meter s'+s;$('#pwl').textContent=s?L('Strength: ','القوة: ')+T(PWL[s]):''}}
function rRegister(){const r=S.reg,e=r.err,s=pwScore(r.pw);
 return `<h1>${L('Register your business','سجّل نشاطك التجاري')}</h1><p class="sub">${L('You will become the protected Owner (CEO) of a new company workspace.','ستصبح المالك المحمي (الرئيس التنفيذي) لمساحة عمل جديدة لشركتك.')}</p>
 <form onsubmit="event.preventDefault();submitRegister()" novalidate class="card card-b" style="padding:22px">
 ${field({id:'name',label:L('Full name','الاسم الكامل'),value:r.name,on:"S.reg.name=this.value",err:e.name,req:1,ac:'name'})}
 ${field({id:'email',label:L('Work email','البريد الإلكتروني للعمل'),type:'email',value:r.email,on:"S.reg.email=this.value",err:e.email,req:1,ac:'email',attrs:'dir="ltr"'})}
 ${field({id:'pw',label:L('Password','كلمة المرور'),type:'password',value:r.pw,on:"pwInput(this.value)",err:e.pw,req:1,ac:'new-password',attrs:'dir="ltr"',extra:`<div id="pwm" class="pw-meter s${s}" aria-hidden="true"><span></span><span></span><span></span><span></span></div><div class="hint" id="pwl">${s?L('Strength: ','القوة: ')+T(PWL[s]):''}</div>`,hint:L('At least 8 characters with upper- and lower-case letters and a number.','8 أحرف على الأقل تتضمن أحرفًا كبيرة وصغيرة ورقمًا.')})}
 <div class="placeholder-box" style="margin-bottom:16px"><div class="ph-label">${L('Placeholder · open in spec','عنصر مؤقت · غير محسوم في المواصفات')}</div>${L('Terms / consent acceptance — shown only "if required/configured" (FL-01, AUTH input fields). Not decided yet.','الموافقة على الشروط — تظهر فقط "إذا كانت مطلوبة/مُفعّلة" (FL-01). لم يُحسم بعد.')}</div>
 <button class="btn primary lg" style="width:100%" type="submit">${L('Create account','إنشاء الحساب')}</button>
 <p class="small muted" style="margin-top:14px;text-align:center">${L('Already have an account?','لديك حساب بالفعل؟')} <button type="button" class="link" onclick="go('login')">${L('Log in','تسجيل الدخول')}</button></p>
 </form><p class="tiny muted" style="margin-top:12px">${L('The owner role is assigned by the server when your company is created — it can never be chosen in the browser (FR-AUTH-004).','يُسنَد دور المالك من الخادم عند إنشاء شركتك — ولا يمكن اختياره من المتصفح أبدًا (FR-AUTH-004).')}</p>`}
function submitRegister(){const r=S.reg,e={};
 if(!r.name.trim())e.name=L('Enter your full name.','أدخل اسمك الكامل.');
 if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(r.email.trim()))e.email=L('Enter a valid email address, e.g. name@company.jo','أدخل بريدًا إلكترونيًا صالحًا، مثل name@company.jo');
 if(pwScore(r.pw)<3||r.pw.length<8)e.pw=L('Use at least 8 characters, mixing upper/lower case and a number.','استخدم 8 أحرف على الأقل تمزج بين الأحرف الكبيرة والصغيرة ورقمًا.');
 r.err=e;if(Object.keys(e).length){render();const k=Object.keys(e)[0];document.getElementById('f_'+k)?.focus();return}
 S.verifyState='sent';go('verify')}

 <div class="placeholder-box" style="margin-top:18px"><div class="ph-label">${L('Open decision','قرار مفتوح')}</div>${L('Token lifetime and resend cooldown are engineering decisions (§10.4) — not shown as fixed values.','مدة صلاحية الرمز وفترة الانتظار قبل إعادة الإرسال قرارات هندسية (§10.4) — لا تُعرض كقيم ثابتة.')}</div></div>`}

const FT={trx:['Transactions','المعاملات'],ar:['Customer invoices','فواتير العملاء'],ap:['Supplier invoices','فواتير الموردين']};
const MAP={

const FIELDS={date:['Transaction date','تاريخ المعاملة'],description:['Description','الوصف'],amount:['Amount','المبلغ'],direction:['Direction (IN/OUT)','الاتجاه (داخل/خارج)'],category:['Category','الفئة'],cfclass:['Cash-flow class','تصنيف التدفق النقدي'],number:['Reference number','الرقم المرجعي'],customer:['Customer','العميل'],supplier:['Supplier','المورد'],issueDate:['Issue date','تاريخ الإصدار'],dueDate:['Due date','تاريخ الاستحقاق'],subtotal:['Pre-tax subtotal','المجموع قبل الضريبة'],taxRate:['Tax rate','نسبة الضريبة'],gross:['Gross amount','المبلغ الإجمالي'],paid:['Paid-to-date','المدفوع حتى تاريخه'],costType:['Cost classification','تصنيف التكلفة'],ignore:['— Don\'t import —','— عدم الاستيراد —']};

function impUpload(){const I=S.imp;
 if(I.analyzing)return `<div class="card card-b" style="padding:24px" aria-busy="true"><div class="row" style="margin-bottom:16px"><span class="spin"></span><strong>${S.aiAvail?L('AI is analyzing your files…','يقوم الذكاء الاصطناعي بتحليل ملفاتك…'):L('Parsing files…','جارٍ تحليل الملفات…')}</strong></div>${[1,2,3].map(()=>`<div class="skel" style="height:44px;margin-bottom:10px"></div>`).join('')}</div>`;
 return `<button class="drop" onclick="addFiles()"><div class="ico-tile" style="margin:0 auto 10px">${icon('upload',22)}</div><strong>${L('Choose CSV files','اختر ملفات CSV')}</strong><div class="small muted">${L('Demo: adds three sample files from Petra Digital','عرض تجريبي: يضيف ثلاثة ملفات نموذجية من بترا الرقمية')}</div></button>

 ${I.files.length?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>${L('File','الملف')}</th><th>${L('Declared type','النوع المحدَّد')}</th><th>${L('Rows','الصفوف')}</th><th></th></tr></thead><tbody>${I.files.map((f,i)=>`<tr><td><span class="num" dir="ltr">${f.name}</span></td><td><select aria-label="${L('Declared type','النوع المحدَّد')}" onchange="S.imp.files[${i}].type=this.value">${Object.keys(FT).map(k=>`<option value="${k}" ${f.type===k?'selected':''}>${T(FT[k])}</option>`).join('')}</select></td><td class="num">${f.rows}</td><td><button class="btn sm ghost" onclick="S.imp.files.splice(${i},1);render()" aria-label="${L('Remove','إزالة')}">${icon('close',15)}</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="note info">${icon('info',18)}<span>${L('Supported: transactions, customer invoices, supplier invoices. You can upload just one — other data can stay "Not Provided" or be marked "Confirmed None".','المدعوم: المعاملات، فواتير العملاء، فواتير الموردين. يمكنك رفع ملف واحد فقط — يمكن أن تبقى البيانات الأخرى "غير مُقدَّمة" أو تُحدَّد "لا يوجد (مؤكَّد)".')}</span></div>`}
 <div class="row" style="margin-top:18px">${S.impInApp?'':`<button class="btn ghost" onclick="go('method')">${L('Back','رجوع')}</button>`}<div class="spacer"></div><button class="btn primary" ${I.files.length?'':'disabled'} onclick="analyze()">${L('Analyze Files','تحليل الملفات')}</button></div>`}
function addFiles(){S.imp.files=SAMPLE_FILES.map(f=>({...f}));render()}
function analyze(){S.imp.analyzing=true;render();setTimeout(()=>{S.imp.analyzing=false;S.imp.step=2;S.imp.mapTab=0;render()},1100)}
function mapRows(type){const I=S.imp;return MAP[type].map((m,i)=>{const key=type+i;const manual=I.manualMap[key];const val=manual!==undefined?manual:(S.aiAvail?m[2]:'');return{h:m[0],sample:m[1],val,conf:S.aiAvail&&manual===undefined?m[3]:null,amb:m[4]&&S.aiAvail,key}})}
function mapBlocking(){const I=S.imp;let n=0;I.files.forEach(f=>mapRows(f.type).forEach(r=>{if(!r.val)n++}));if(I.files.some(f=>f.type==='trx')&&!I.dirConv)n++;return n}
function impMap(){const I=S.imp;const f=I.files[I.mapTab];const rows=mapRows(f.type);const opts=Object.keys(FIELDS).filter(k=>MAP[f.type].some(m=>m[2]===k)||k==='ignore');const blk=mapBlocking();
 return `${S.aiAvail?'':`<div class="note warn" style="margin-bottom:12px">${icon('alert',18)}<span>${L('AI is unavailable right now. Map each column manually — import, validation and calculations still work.','الذكاء الاصطناعي غير متاح حاليًا. اربط كل عمود يدويًا — يستمر الاستيراد والتحقق والحسابات بالعمل.')}</span></div>`}
 <div class="tabs" role="tablist">${I.files.map((x,i)=>`<button role="tab" aria-selected="${i===I.mapTab}" onclick="S.imp.mapTab=${i};render()">${T(FT[x.type])} <span class="muted num" dir="ltr">(${x.name})</span></button>`).join('')}</div>
 <div class="tbl-wrap"><table class="tbl"><thead><tr><th>${L('Original header','العنوان الأصلي')}</th><th>${L('Sample value','قيمة نموذجية')}</th><th>${L('Maps to field','يُربط بالحقل')}</th><th>${L('AI confidence','ثقة الذكاء الاصطناعي')}</th></tr></thead><tbody>
 ${rows.map(r=>`<tr class="${!r.val?'r-err':r.amb?'r-dup':''}"><td><strong class="num" dir="ltr">${r.h}</strong></td><td class="muted num" dir="ltr">${r.sample}</td><td><select aria-label="${L('Field for','الحقل لـ')} ${r.h}" onchange="S.imp.manualMap['${r.key}']=this.value;render()"><option value="">${L('Select field…','اختر الحقل…')}</option>${opts.map(k=>`<option value="${k}" ${r.val===k?'selected':''}>${T(FIELDS[k])}</option>`).join('')}</select></td><td>${r.conf!=null?`<span class="conf ${r.conf<80?'low':''}"><i><b style="width:${r.conf}%"></b></i><span class="num">${r.conf}%</span></span>`:`<span class="muted small">${S.aiAvail?L('Manual','يدوي'):'—'}</span>`}</td></tr>`).join('')}
 </tbody></table></div>
 ${f.type==='trx'?`<div class="card card-b" style="margin-top:14px;border-color:${I.dirConv?'var(--line)':'#E5C27F'}"><div class="row" style="margin-bottom:8px">${I.dirConv?`<span class="pill p-ok">${icon('check',13)}${L('Resolved','تم الحل')}</span>`:`<span class="pill p-warn">${L('Needs your decision','يحتاج إلى قرارك')}</span>`}<strong>${L('What does "D" in the Dr/Cr column mean?','ماذا يعني "D" في عمود Dr/Cr؟')}</strong></div>
 <p class="small muted" style="margin-bottom:10px">${L('The AI isn\'t sure (62%). Amount direction is never guessed — please confirm.','الذكاء الاصطناعي غير متأكد (62%). لا يُخمَّن اتجاه المبلغ أبدًا — يُرجى التأكيد.')}</p>
 <div class="row"><label class="check"><input type="radio" name="dc" ${I.dirConv==='out'?'checked':''} onchange="S.imp.dirConv='out';render()">${L('D = cash OUT (debit to bank statement)','D = نقد خارج')}</label><label class="check"><input type="radio" name="dc" ${I.dirConv==='in'?'checked':''} onchange="S.imp.dirConv='in';render()">${L('D = cash IN','D = نقد داخل')}</label></div></div>`:''}
 <div class="row" style="margin-top:18px"><button class="btn ghost" onclick="S.imp.step=1;render()">${L('Back','رجوع')}</button><div class="spacer"></div>${blk?`<span class="small" style="color:var(--warn)">${blk} ${L('item(s) still need a decision','عنصر/عناصر ما زالت بحاجة إلى قرار')}</span>`:''}<button class="btn primary" ${blk?'disabled':''} onclick="S.imp.step=3;S.imp.tab=S.imp.files[0].type;render()">${L('Confirm mapping','تأكيد الربط')}</button></div>`}

/* review (FL-07) */
const okDate=d=>/^\d{4}-\d{2}-\d{2}$/.test(d)&&!isNaN(new Date(d));
function rowErrors(type,r){const e={};const n=v=>Number(String(v).replace(/,/g,''));
 if(type==='trx'){if(!okDate(r.date))e.date=L('Date is required (YYYY-MM-DD).','التاريخ مطلوب (YYYY-MM-DD).');if(!(n(r.amount)>0))e.amount=L('Amount must be a positive number.','يجب أن يكون المبلغ رقمًا موجبًا.')}
 if(type==='ar'){const g=n(r.sub)*(1+n(r.tax)/100);if(!(n(r.sub)>0))e.sub=L('Subtotal must be positive.','يجب أن يكون المجموع موجبًا.');if(n(r.paid)<0||n(r.paid)>g+0.001)e.paid=L('Paid-to-date must be between 0 and the gross amount','يجب أن يكون المدفوع بين 0 والمبلغ الإجمالي')+` (JOD ${fmt(g)}).`;if(!okDate(r.due))e.due=L('Valid due date required.','تاريخ استحقاق صالح مطلوب.')}
 if(type==='ap'){if(!(n(r.gross)>0))e.gross=L('Gross must be positive.','يجب أن يكون الإجمالي موجبًا.');if(n(r.paid)<0||n(r.paid)>n(r.gross))e.paid=L('Paid-to-date can\'t exceed the gross amount','لا يمكن أن يتجاوز المدفوع المبلغ الإجمالي')+` (JOD ${fmt(n(r.gross))}).`;if(!okDate(r.due))e.due=L('Valid due date required.','تاريخ استحقاق صالح مطلوب.')}
 return e}
function impIssues(){const I=S.imp;let errs=0,dups=0;I.files.forEach(f=>I.rows[f.type].forEach(r=>{errs+=Object.keys(rowErrors(f.type,r)).length;if(r.dupOf&&!I.dup[f.type+r.id])dups++}));return{errs,dups}}
function editCell(t,id,k,v){const r=S.imp.rows[t].find(x=>x.id===id);r[k]=v;S.imp.validated=false;valBanner()}
function setDup(t,id,v){S.imp.dup[t+id]=v;S.imp.validated=false;valBanner()}
function valBanner(){const el=$('#valBanner');if(el)el.innerHTML=valBannerHTML();const b=$('#toConfirm');if(b)b.disabled=!S.imp.validated}
function valBannerHTML(){const I=S.imp;if(I.validated)return `<div class="note ok">${icon('check',18)}<span>${L('All staged rows are valid and every duplicate has a decision. Ready to confirm.','جميع الصفوف المؤقتة صالحة ولكل تكرار قرار. جاهز للتأكيد.')}</span></div>`;
 const {errs,dups}=impIssues();if(I.checked)return `<div class="note ${errs||dups?'bad':'warn'}" role="status">${icon('alert',18)}<span>${errs||dups?`${errs} ${L('field error(s) and','خطأ/أخطاء في الحقول و')} ${dups} ${L('duplicate decision(s) remaining. Fix them, then validate again.','قرار/قرارات تكرار متبقية. أصلحها ثم تحقّق مجددًا.')}`:L('You made edits — click Validate again before continuing.','أجريت تعديلات — اضغط "تحقّق" مرة أخرى قبل المتابعة.')}</span></div>`;
 return `<div class="note info">${icon('info',18)}<span>${L('Highlighted rows need attention. Duplicates are never removed automatically — choose what to do with each one, then click Validate.','الصفوف المميَّزة تحتاج إلى انتباه. لا تُحذف التكرارات تلقائيًا أبدًا — اختر ما تريد فعله بكل منها، ثم اضغط "تحقّق".')}</span></div>`}
function validateImp(){const {errs,dups}=impIssues();S.imp.checked=true;S.imp.validated=!errs&&!dups;render();announce(S.imp.validated?L('Validation passed','نجح التحقق'):L('Validation found issues','وجد التحقق مشكلات'))}
function cellIn(t,r,k,errs,o={}){const bad=errs[k]?'bad':'';return `<input class="${bad}" value="${esc(r[k])}" ${o.dir?'dir="ltr"':''} aria-label="${o.label||k}" ${errs[k]?`aria-invalid="true" title="${esc(errs[k])}"`:''} oninput="editCell('${t}',${r.id},'${k}',this.value)">`}
function impReview(){const I=S.imp;const t=I.tab;const rows=I.rows[t];
 const cols={trx:[['date',L('Date','التاريخ'),1],['desc',L('Description','الوصف')],['amount',L('Amount','المبلغ'),1],['dir',L('Dir.','الاتجاه'),1],['cat',L('Category','الفئة')],['cls',L('Cash-flow class','تصنيف التدفق')]],
  ar:[['ref',L('Ref','المرجع'),1],['cust',L('Customer','العميل')],['due',L('Due','الاستحقاق'),1],['sub',L('Subtotal','قبل الضريبة'),1],['tax',L('Tax %','الضريبة %'),1],['paid',L('Paid-to-date','المدفوع'),1]],
  ap:[['ref',L('Ref','المرجع'),1],['sup',L('Supplier','المورد')],['due',L('Due','الاستحقاق'),1],['gross',L('Gross','الإجمالي'),1],['paid',L('Paid-to-date','المدفوع'),1],['ctype',L('Cost class','تصنيف التكلفة')]]}[t];
 const total=I.files.find(f=>f.type===t)?.rows||0;
 return `<div id="valBanner" style="margin-bottom:12px">${valBannerHTML()}</div>
 <div class="tabs" role="tablist">${I.files.map(f=>{const n=I.rows[f.type].filter(r=>Object.keys(rowErrors(f.type,r)).length||(r.dupOf&&!I.dup[f.type+r.id])).length;return `<button role="tab" aria-selected="${t===f.type}" onclick="S.imp.tab='${f.type}';render()">${T(FT[f.type])} ${n?`<span class="pill p-bad">${n}</span>`:''}</button>`}).join('')}</div>
 <p class="small muted" style="margin-bottom:8px">${L('Showing the rows that need review and a sample of the rest','عرض الصفوف التي تحتاج مراجعة وعينة من الباقي')} · <span class="num">${total}</span> ${L('rows in file','صفًا في الملف')}</p>
 <div class="tbl-wrap"><table class="tbl"><thead><tr><th>#</th>${cols.map(c=>`<th>${c[1]}</th>`).join('')}<th>${L('Status','الحالة')}</th></tr></thead><tbody>
 ${rows.map(r=>{const e=rowErrors(t,r);const dup=r.dupOf;const ek=Object.keys(e);
  return `<tr class="${ek.length?'r-err':dup?'r-dup':''}"><td class="num muted">${r.id}</td>${cols.map(c=>`<td class="${['desc','cust','sup'].includes(c[0])?'wide-c':''}">${cellIn(t,r,c[0],e,{dir:c[2],label:c[1]+' '+r.id})}</td>`).join('')}
  <td style="min-width:220px">${ek.map(k=>`<div class="err">${icon('alert',14)}<span>${e[k]}</span></div>`).join('')}
  ${dup?`<div class="small" style="margin-bottom:6px"><span class="pill ${r.dupKind==='exact'?'p-bad':'p-warn'}">${r.dupKind==='exact'?L('Exact duplicate','تكرار مطابق'):L('Possible duplicate','تكرار محتمل')}</span> ${L('of row','للصف')} ${r.dupOf}</div><select aria-label="${L('Duplicate decision','قرار التكرار')}" onchange="setDup('${t}',${r.id},this.value)"><option value="">${L('Choose…','اختر…')}</option><option value="keep" ${I.dup[t+r.id]==='keep'?'selected':''}>${L('Keep both — separate items','الإبقاء على الاثنين — بندان منفصلان')}</option><option value="exclude" ${I.dup[t+r.id]==='exclude'?'selected':''}>${L('Exclude this row','استبعاد هذا الصف')}</option></select>`:''}
  ${!ek.length&&!dup?`<span class="pill p-ok">${icon('check',12)}${L('Ready','جاهز')}</span>`:''}</td></tr>`}).join('')}
 </tbody></table></div>
 <div class="row" style="margin-top:18px"><button class="btn ghost" onclick="S.imp.step=2;render()">${L('Back','رجوع')}</button><div class="spacer"></div><button class="btn" onclick="validateImp()">${icon('check',16)}${L('Validate','تحقّق')}</button><button class="btn primary" id="toConfirm" ${I.validated?'':'disabled'} onclick="S.imp.step=4;render()">${L('Continue','متابعة')}</button></div>`}
function impCounts(){const I=S.imp;const c={};I.files.forEach(f=>{const ex=I.rows[f.type].filter(r=>I.dup[f.type+r.id]==='exclude').length;c[f.type]={total:f.rows-ex,ex}});return c}
function impConfirm(){const I=S.imp;const c=impCounts();const tot=Object.values(c).reduce((a,b)=>a+b.total,0);
 if(I.processing)return `<div class="card card-b" style="padding:28px" aria-busy="true"><div class="row"><span class="spin"></span><strong>${L('Re-validating and committing in one transaction…','إعادة التحقق والحفظ ضمن معاملة واحدة…')}</strong></div></div>`;
 return `<div class="statgrid">${Object.keys(c).map(k=>`<div class="card stat"><div class="small muted">${T(FT[k])}</div><div class="v num">${c[k].total}</div><div class="tiny muted">${c[k].ex?`${c[k].ex} ${L('excluded duplicate','تكرار مستبعد')}`:L('No exclusions','لا استبعادات')}</div></div>`).join('')}</div>
 <div class="card card-b" style="margin-top:14px"><h3 style="margin-bottom:10px">${L('Before you import','قبل الاستيراد')}</h3><ul class="list">
 <li>${icon('cash',18)}<span>${L('Only transactions change actual cash. Paid-to-date on invoices updates balances owed, never cash.','المعاملات فقط تغيّر النقد الفعلي. المدفوع حتى تاريخه في الفواتير يحدّث الأرصدة المستحقة فقط، وليس النقد.')}</span></li>
 <li>${icon('report',18)}<span>${L('Invoices affect recognized revenue and expenses — profit is not the same as cash.','تؤثر الفواتير على الإيرادات والمصروفات المعترف بها — الربح ليس هو النقد.')}</span></li>
 <li>${icon('admin',18)}<span>${L('All-or-nothing: if any row fails at commit, nothing is imported and your draft is kept.','الكل أو لا شيء: إذا فشل أي صف عند الحفظ، لا يُستورد شيء وتبقى المسودة محفوظة.')}</span></li>
 ${S.policy&&S.role!=='CEO'?`<li>${icon('lock',18)}<span>${L('Your company requires CEO approval for imports. This batch will be submitted for approval and won\'t be official until approved.','تتطلب شركتك موافقة الرئيس التنفيذي على الاستيراد. ستُرسل هذه الدفعة للموافقة ولن تكون رسمية قبل اعتمادها.')}</span></li>`:''}
 </ul></div>
 <label class="check" style="margin-top:14px"><input type="checkbox" ${I.failSim?'checked':''} onchange="S.imp.failSim=this.checked">${L('Simulate a database failure at commit (demo)','محاكاة فشل في قاعدة البيانات عند الحفظ (عرض تجريبي)')}</label>
 <div class="row" style="margin-top:18px"><button class="btn ghost" onclick="S.imp.step=3;render()">${L('Back','رجوع')}</button><div class="spacer"></div><button class="btn primary lg" onclick="commitImp()">${S.policy&&S.role!=='CEO'?L('Submit for CEO approval','إرسال لموافقة الرئيس التنفيذي'):L('Confirm & Import','تأكيد واستيراد')} <span class="num">(${tot})</span></button></div>`}
function commitImp(){const I=S.imp;I.processing=true;render();setTimeout(()=>{I.processing=false;
 if(I.failSim){I.result={ok:false};I.step=5;render();return}
 if(S.policy&&S.role!=='CEO'){S.approvals.unshift({id:'APR-'+(312+S.approvals.length),by:ROLES[S.role][2],type:['CSV import batch','دفعة استيراد CSV'],ref:I.files.map(f=>f.name).join(', '),field:['Records','السجلات'],before:'—',after:String(Object.values(impCounts()).reduce((a,b)=>a+b.total,0)),reason:['Monthly import','استيراد شهري'],on:AS_OF,status:'pending',mine:true});I.result={ok:true,pending:true};I.step=5;render();return}
 const c=impCounts();I.files.forEach(f=>{const g={trx:'D2',ar:'D3',ap:'D4'}[f.type];S.groups[g]='entered';S.counts[g]+=c[f.type].total});
 I.result={ok:true,counts:c};I.step=5;S.updating=true;render();
 setTimeout(()=>{S.updating=false;S.snap={v:S.snap.v+1,at:new Date().toISOString(),why:'import'};render()},1800)},1200)}
function impResult(){const I=S.imp,r=I.result;
 if(!r.ok)return `<div class="card card-b" style="padding:26px"><div class="note bad" role="alert" style="margin-bottom:16px">${icon('alert',18)}<div><strong>${L('Import rolled back — 0 records were committed.','تم التراجع عن الاستيراد — لم يُحفظ أي سجل.')}</strong><br>${L('A database error happened during commit. Your official records are unchanged and your reviewed draft is kept so you can retry.','حدث خطأ في قاعدة البيانات أثناء الحفظ. سجلاتك الرسمية لم تتغير ومسودتك المُراجعة محفوظة لتعيد المحاولة.')}</div></div><button class="btn primary" onclick="S.imp.failSim=false;S.imp.step=4;render()">${L('Back to confirmation','العودة إلى التأكيد')}</button></div>`;
 if(r.pending)return `<div class="card card-b" style="padding:26px"><div class="note warn" style="margin-bottom:16px">${icon('lock',18)}<div><strong>${L('Pending CEO approval','بانتظار موافقة الرئيس التنفيذي')}</strong><br>${L('The batch is saved as a request. It won\'t appear in reports or KPIs until the CEO approves it.','حُفظت الدفعة كطلب. لن تظهر في التقارير أو المؤشرات حتى يوافق عليها الرئيس التنفيذي.')}</div></div><button class="btn primary" onclick="S.screen='app';S.page='summary';render()">${L('Back to Summary','العودة إلى الملخص')}</button></div>`;
 const tot=Object.values(r.counts).reduce((a,b)=>a+b.total,0);
 return `<div class="card card-b" style="padding:26px"><div class="note ok" style="margin-bottom:16px">${icon('check',18)}<div><strong><span class="num">${tot}</span> ${L('records committed in one batch.','سجلًا حُفظت في دفعة واحدة.')}</strong><br>${Object.keys(r.counts).map(k=>`${T(FT[k])}: <span class="num">${r.counts[k].total}</span>`).join(' · ')}</div></div>
 <div class="snap" aria-live="polite">${S.updating?`<span class="spin"></span>${L('Updating metrics… recalculating all 33 KPIs from the new records.','جارٍ تحديث المؤشرات… إعادة احتساب جميع المؤشرات الـ33 من السجلات الجديدة.')}`:`${icon('check',16)}${L('Metrics snapshot','لقطة المؤشرات')} v${S.snap.v} ${L('calculated','احتُسبت')} · ${DT(new Date(S.snap.at))}`}</div>
 <div class="row" style="margin-top:16px">${S.impInApp?`<button class="btn primary" onclick="S.screen='app';S.page='summary';render()">${L('Back to Summary','العودة إلى الملخص')}</button>`:`<button class="btn primary" onclick="go('readiness')">${L('Continue to Financial Readiness','المتابعة إلى الجاهزية المالية')}</button>`}</div></div>`}

/* ---------- FL-09 manual hub ---------- */
function rManual(){const items=[['D2','trx'],['D3','ar'],['D4','ap'],['D5','obl'],['ADJ','adj']];
 return `<h1>${L('Start from scratch','البدء من الصفر')}</h1><p class="sub">${L('Add what you have. If a group truly has no records, confirm that — it is different from "not provided yet".','أضف ما لديك. إذا لم تكن لدى مجموعة أي سجلات فعلًا، فأكّد ذلك — وهذا يختلف عن "لم تُقدَّم بعد".')}</p>
 <div class="rd-list">${items.map(([g,f])=>{const isAdj=g==='ADJ';const st=isAdj?(S.counts.ADJ?'entered':'np'):S.groups[g];const s=STATUS[st];
 return `<div class="card rd"><div class="code">${isAdj?'ADJ':g}</div><div><strong>${isAdj?L('Accounting adjustments (optional)','التسويات المحاسبية (اختيارية)'):T(GROUPS[g])}</strong><div class="small muted">${isAdj?L('Non-cash entries such as depreciation. Never change actual cash.','قيود غير نقدية مثل الإهلاك. لا تغيّر النقد الفعلي أبدًا.'):`${S.counts[g]} ${L('records','سجل')}`}</div></div>
 <div class="row"><span class="pill ${isAdj&&!S.counts.ADJ?'p-neutral':s[2]}">${isAdj&&!S.counts.ADJ?L('Optional','اختياري'):L(s[0],s[1])}</span><button class="btn sm" onclick="openForm('${f}')">${icon('plus',15)}${L('Add record','إضافة سجل')}</button>${isAdj?'':`<button class="btn sm ghost" onclick="S.groups.${g}='none';render()">${L('We have none','لا يوجد لدينا')}</button>`}</div></div>`}).join('')}</div>
 <div class="row" style="margin-top:20px"><button class="btn ghost" onclick="go('method')">${L('Back','رجوع')}</button><div class="spacer"></div><button class="btn primary lg" onclick="go('readiness')">${L('Continue','متابعة')}</button></div>`}

 return `<h1>${L('Financial readiness','الجاهزية المالية')}</h1><p class="sub">${L('Here\'s what FinPilot can calculate with the data you\'ve provided. You can go to the Summary now and add more later.','إليك ما يستطيع FinPilot احتسابه بالبيانات التي قدّمتها. يمكنك الانتقال إلى الملخص الآن وإضافة المزيد لاحقًا.')}</p>
 <div class="rd-list">${Object.keys(GROUPS).map(g=>{const st=S.groups[g];const s=STATUS[st];
  const act=g==='D1'?(st==='attention'?`<button class="btn sm" onclick="go('finance')">${L('Add opening cash','إضافة النقد الافتتاحي')}</button>`:''):(st==='np'?`<button class="btn sm" onclick="openForm('${{D2:'trx',D3:'ar',D4:'ap',D5:'obl'}[g]}')">${icon('plus',15)}${L('Add records','إضافة سجلات')}</button><button class="btn sm ghost" onclick="S.groups.${g}='none';render()">${L('Confirm none','تأكيد عدم الوجود')}</button>`:'');
  const desc=g==='D1'?(st==='attention'?L('Opening cash is unknown — never treated as JOD 0.','النقد الافتتاحي غير معروف — لا يُعامَل أبدًا على أنه 0 دينار.'):L('Currency, fiscal year and opening cash saved.','تم حفظ العملة والسنة المالية والنقد الافتتاحي.')):st==='none'?L('You confirmed there are no records — values count as zero.','أكّدت عدم وجود سجلات — تُحتسب القيم صفرًا.'):st==='np'?L('Unknown — dependent KPIs show "Insufficient Data", not zero.','غير معروف — تظهر المؤشرات المعتمدة بحالة "بيانات غير كافية"، وليس صفرًا.'):`${S.counts[g]} ${L('records','سجل')}`;
  return `<div class="card rd"><div class="code">${g}</div><div><strong>${T(GROUPS[g])}</strong><div class="small muted">${desc}</div></div><div class="row"><span class="pill ${s[2]}">${L(s[0],s[1])}</span>${act}</div></div>`}).join('')}</div>
 <div class="card card-b" style="margin-top:16px"><div class="row" style="margin-bottom:6px"><h3>${L('KPI coverage','تغطية المؤشرات')}</h3><span class="pill ${un.length?'p-warn':'p-ok'}"><span class="num">${avail.length}</span> / 33 ${L('available','متاح')}</span></div>
 ${un.length?`<p class="small muted" style="margin-bottom:8px">${L('These will show "Insufficient Data" on the Summary and in reports:','ستظهر هذه بحالة "بيانات غير كافية" في الملخص والتقارير:')}</p><div class="tbl-wrap"><table class="tbl"><thead><tr><th>#</th><th>${L('KPI','المؤشر')}</th><th>${L('Missing','الناقص')}</th></tr></thead><tbody>${un.map(k=>`<tr><td class="num muted">${k[0]}</td><td>${L(k[1],k[2])}</td><td>${missing(k[3]).map(g=>`<span class="pill p-neutral" style="margin:1px">${g} · ${T(GROUPS[g])}</span>`).join(' ')}</td></tr>`).join('')}</tbody></table></div>`:`<p class="small">${L('All 33 KPIs can be calculated.','يمكن احتساب جميع المؤشرات الـ33.')}</p>`}</div>
 <div class="row" style="margin-top:20px"><button class="btn ghost" onclick="go('method')">${L('Add more data','إضافة مزيد من البيانات')}</button><div class="spacer"></div><button class="btn primary lg" onclick="enterApp()">${L('Go to Summary','الانتقال إلى الملخص')}${icon('chev',16)}</button></div>`}

 </header><main class="content" id="main" tabindex="-1">${rPage(p)}</main></div></div>`}

 {id:'a4',sev:'med',t:['Cash below threshold within 30 days','النقد دون الحد خلال 30 يومًا'],d:[`Lowest point JOD 920 on ${D('2026-11-10')} — threshold JOD 2,000.`,`أدنى نقطة 920 د.أ في ${D('2026-11-10')} — الحد 2,000 د.أ.`],src:['Cash-flow forecast · 30 days','توقع التدفق النقدي · 30 يومًا'],page:'forecast',kpi:25}];
const scopeTag={period:()=>`<span class="pill p-period">${icon('task',12)}${pLabel()}</span>`,asof:()=>`<span class="pill p-asof">${L('As of','حتى')} ${D(AS_OF)}</span>`,fc:h=>`<span class="pill p-fc">${L('Forecast','توقع')} · ${h} ${L('days','يومًا')}</span>`};
function kpiCards(){const ytd=!PERIODS[S.period].idx;
 const defs=[
  {k:'cash',id:1,n:['Current Cash','رصيد النقد الحالي'],scope:'asof',deps:['D1','D2'],v:cashNow(),sub:()=>L('Opening cash + all cash IN − OUT','النقد الافتتاحي + كل الداخل − الخارج')},
  {k:'rev',id:7,n:['Revenue','الإيرادات'],scope:'period',deps:['D3'],v:pv('rev'),cmp:'rev'},
  {k:'np',id:15,n:['Net Profit','صافي الربح'],scope:'period',deps:['D3','D4','D5'],v:pv('np'),cmp:'np'},
  {k:'ncf',id:4,n:['Net Cash Flow','صافي التدفق النقدي'],scope:'period',deps:['D2'],v:pv('ncf'),cmp:'ncf'},
  {k:'exp',id:9,n:['Total Expenses','إجمالي المصروفات'],scope:'period',deps:['D4','D5'],v:pv('exp'),cmp:'exp',inv:true},
  {k:'run',id:6,n:['Cash Runway','مدة كفاية النقد'],scope:'asof',deps:['D1','D2'],v:runway().v,unit:'mo'}];
 return defs.map(d=>{const miss=missing(d.deps);let body;
  if(S.sumState==='loading')return `<div class="kpi" aria-busy="true"><div class="skel" style="height:14px;width:55%"></div><div class="skel" style="height:30px;width:70%;margin:6px 0"></div><div class="skel" style="height:12px;width:40%"></div></div>`;
  if(miss.length)body=`<div class="insuf">${icon('alert',18)}${L('Insufficient Data','بيانات غير كافية')}</div><div class="foot">${L('Needs','يتطلب')}: ${miss.map(g=>T(GROUPS[g])).join(', ')}</div>`;
  else if(d.scope==='period'&&ytd)body=`<div class="insuf">${icon('alert',18)}${L('Insufficient Data','بيانات غير كافية')}</div><div class="foot">${L('Records start Jun 2026 — YTD 2026 needs Jan–May.','تبدأ السجلات في يونيو 2026 — يتطلب "منذ بداية 2026" بيانات يناير–مايو.')}</div>`;
  else if(d.k==='run'){body=d.v==null?`<div class="val">${L('N/A','غير متاح')}</div><div class="foot">${L('No net cash burn in the last 3 months','لا يوجد استنزاف نقدي صافٍ في آخر 3 أشهر')}</div>`:`<div class="val num">≈ ${d.v.toFixed(1)} <span style="font-size:16px;font-weight:500">${L('months','أشهر')}</span></div><div class="foot">${L('Estimate · avg. net burn','تقدير · متوسط الاستنزاف')} ${money(runway().burn)}/${L('mo','شهر')} (${L('Aug–Oct','أغسطس–أكتوبر')})</div>`}
  else{const pv_=d.cmp?prevVal(d.cmp):null;let delta='';if(pv_!=null&&pv_!==0){const diff=d.v-pv_;const good=d.inv?diff<0:diff>0;const pctOk=pv_>0&&d.v>0;delta=`<span class="${good?'delta-up':'delta-dn'} num" dir="ltr">${diff>=0?'▲':'▼'} ${pctOk?Math.abs(diff/pv_*100).toFixed(1)+'%':'JOD '+fmt(diff)}</span> ${L('vs previous month','مقارنة بالشهر السابق')}`}else if(d.cmp)delta=L('No comparable prior period','لا توجد فترة سابقة قابلة للمقارنة');
   body=`<div class="val ${d.v<0?'neg':''}">${money(d.v)}</div><div class="foot">${delta||(d.sub?d.sub():'')}</div>`}
  return `<button class="kpi ${S.updating?'busy':''}" onclick="openDrawer('kpi','${d.k}')" aria-label="${T(d.n)} — ${L('open formula and evidence','فتح المعادلة والأدلة')}"><div class="lbl"><span>${T(d.n)}</span>${scopeTag[d.scope]()}</div>${body}</button>`}).join('')}
function snapBar(){if(S.updating)return `<div class="snap" role="status"><span class="badge-official">${L('OFFICIAL','رسمي')}</span><span class="spin"></span><strong>${L('Updating metrics…','جارٍ تحديث المؤشرات…')}</strong><span class="muted">${L('Showing snapshot','عرض اللقطة')} v${S.snap.v} ${L('until the recalculation finishes.','حتى تنتهي إعادة الاحتساب.')}</span></div>`;
 const why={daily:L('daily run','التشغيل اليومي'),save:L('after a saved change','بعد حفظ تغيير'),import:L('after CSV import','بعد استيراد CSV'),approval:L('after an approved change','بعد اعتماد تغيير')}[S.snap.why];
 return `<div class="snap"><span class="badge-official">${L('OFFICIAL','رسمي')}</span><span>${L('Metrics snapshot','لقطة المؤشرات')} <strong class="num">v${S.snap.v}</strong></span><span class="muted">·</span><span>${L('Last calculated','آخر احتساب')} <strong>${DT(new Date(S.snap.at))}</strong> (${why})</span><span class="muted">·</span><span class="muted">${L('Data as of','البيانات حتى')} ${D(AS_OF)}</span></div>`}
function rSummary(){const loading=S.sumState==='loading';const ceo=S.role==='CEO';const empty=S.sumState==='empty';
 const hello=`<div class="page-h"><div><h1>${L('Summary','الملخص')}</h1><p class="muted small">${esc(S.companyName)} · ${L('Recalculated after every committed change and once a day.','يُعاد الاحتساب بعد كل تغيير معتمد ومرة يوميًا.')}</p></div></div>`;
 const emptyBanner=empty?`<div class="card empty" style="margin-top:14px"><div class="ico-tile">${icon('records',22)}</div><h3>${L('No financial records yet','لا توجد سجلات مالية بعد')}</h3><p class="small muted" style="max-width:520px">${L('Your workspace is ready. Values that depend on records show "Insufficient Data" rather than zero until you add or import data, or confirm a group has none.','مساحة عملك جاهزة. تظهر القيم المعتمدة على السجلات بحالة "بيانات غير كافية" بدلًا من الصفر حتى تضيف البيانات أو تستوردها، أو تؤكد عدم وجود سجلات لمجموعة ما.')}</p>${canCreate()?`<div class="row"><button class="btn primary" onclick="startImport()">${icon('upload',16)}${L('Import CSV','استيراد CSV')}</button><button class="btn" onclick="openForm('trx')">${icon('plus',16)}${L('Add a transaction','إضافة معاملة')}</button></div>`:''}</div>`:'';

 ${sec(2,'Financial Analytics','التحليلات المالية',`<button class="btn sm ghost" onclick="resetSlots()">${L('Reset Default Charts','استعادة الرسوم الافتراضية')}</button><button class="btn sm" onclick="nav('charts')">${L('View All Charts','عرض جميع الرسوم')}</button>`)}
 <div class="charts">${S.slots.map((id,i)=>chartCard(id,i)).join('')}</div>
 ${sec(3,'Receivables & Payables','الذمم المدينة والدائنة')}${rRP()}
 ${sec(4,'Forecast & Liquidity','التوقعات والسيولة',`<div class="seg" role="group" aria-label="${L('Forecast horizon','أفق التوقع')}">${[30,90].map(h=>`<button aria-pressed="${S.horizon===h}" onclick="S.horizon=${h};render()">${h} ${L('days','يومًا')}</button>`).join('')}</div>`)}${rFL()}
 ${sec(5,'Financial Alerts & Risks','التنبيهات والمخاطر المالية',ceo?`<button class="btn sm ghost" onclick="nav('alerts')">${L('All alerts','كل التنبيهات')}</button>`:'')}${rAlerts()}
 ${sec(6,'AI Financial Insights','رؤى مالية بالذكاء الاصطناعي')}${rAI()}
 ${sec(7,ceo?'Tasks & Approvals':'My Tasks & Requests',ceo?'المهام والموافقات':'مهامي وطلباتي')}${rTasks()}`}

function niceMax(v){if(v<=0)return 0;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;return(n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}
function shortN(n,u){if(u==='%')return Math.round(n)+'%';if(u==='mo')return String(Math.round(n));const a=Math.abs(n);return(n<0?'−':'')+(a>=1000?(a/1000).toFixed(a%1000===0?0:1)+'k':String(Math.round(a)))}
function svgChart(def,title,wide){const W=wide?1100:640,Hh=wide?260:240,pl=50,pr=14,pt=14,pb=34;const all=def.series.flatMap(s=>s.data.filter(v=>v!=null)).concat(def.threshold?[def.threshold]:[]);
 const rmax=Math.max(0,...all),rmin=Math.min(0,...all);const st=niceMax((rmax-rmin)/4)||1;let mx=Math.ceil(rmax/st)*st||st,mn=Math.floor(rmin/st)*st;
 const y=v=>pt+(mx-v)/(mx-mn)*(Hh-pt-pb);const n=def.labels.length,cw=(W-pl-pr)/n;let g='';
 for(let v=mn;v<=mx+1e-9;v+=st){g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" class="grid"/><text x="${pl-7}" y="${y(v)+4}" text-anchor="end">${shortN(v,def.unit)}</text>`}
 if(mn<0)g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(0)}" y2="${y(0)}" class="zero"/>`;
 if(def.threshold)g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(def.threshold)}" y2="${y(def.threshold)}" class="thr"/>`;
 const step=Math.ceil(n/8);
 def.labels.forEach((l,i)=>{if(i%step===0||i===n-1)g+=`<text x="${pl+cw*i+cw/2}" y="${Hh-12}" text-anchor="middle">${l}</text>`});
 if(def.kind==='bar'){const k=def.series.length,bw=Math.min(30,cw*.72/k);
  def.series.forEach((s,si)=>s.data.forEach((v,i)=>{if(v==null)return;const x=pl+cw*i+cw/2-bw*k/2+si*bw;const y0=y(0),y1=y(v);const col=s.signed?(v<0?'var(--neg)':'var(--pos)'):(s.colors?s.colors[i]:s.color);
   g+=`<rect x="${x+1.5}" y="${Math.min(y0,y1)}" width="${bw-3}" height="${Math.max(1.5,Math.abs(y1-y0))}" rx="3" fill="${col}"><title>${def.labels[i]} · ${s.name}: ${valFmt(v,def.unit)}</title></rect>`}))}
 else{def.series.forEach(s=>{const pts=s.data.map((v,i)=>v==null?null:[pl+cw*i+cw/2,y(v)]);let d='',open=false;pts.forEach(p=>{if(!p){open=false;return}d+=(open?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1);open=true});
  g+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.4" ${s.dash?'stroke-dasharray="6 4"':''}/>`;
  pts.forEach((p,i)=>{if(!p){g+=`<text x="${pl+cw*i+cw/2}" y="${y(mn<0?0:mx/2)}" text-anchor="middle" style="fill:var(--warn);font-weight:600">${L('N/A','غير متاح')}</text>`;return}const v=s.data[i];g+=`<circle cx="${p[0]}" cy="${p[1]}" r="${n>12?2.6:3.6}" fill="${v<0?'var(--neg)':'#fff'}" stroke="${v<0?'var(--neg)':s.color}" stroke-width="2"><title>${def.labels[i]}: ${valFmt(v,def.unit)}</title></circle>`})})}
 return `<svg class="chart-svg" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="${esc(title||'')}" dir="ltr">${g}</svg>`}

  {k:'type',l:['Type','النوع'],ty:'select',req:1,o:[['',['Select…','اختر…']],['dep',['Depreciation','إهلاك']],['amort',['Amortization','إطفاء']],['prepaid',['Prepaid expense allocation','توزيع مصروف مدفوع مقدمًا']],['accrual',['Accrual','استحقاق']],['other',['Other (manual reason)','أخرى (سبب يدوي)']]]},
  {k:'period',l:['Recognition period','فترة الاعتراف'],ty:'month',req:1},{k:'amount',l:['Amount (JOD)','المبلغ (د.أ)'],ty:'money',req:1},{k:'reason',l:['Reason / source','السبب / المصدر'],ty:'text',req:1,full:1}]}};
function openForm(k){S.overlay={type:'modal',kind:'form',form:k,vals:{},err:{},aiOk:false};S.menu=null;S.focusNext='ff_'+FORMS[k].f[0].k;render()}
function rFormModal(o){const F=FORMS[o.form];const v=o.vals,e=o.err;const pend=S.screen==='app'&&S.policy&&S.role!=='CEO';
 const gross=o.form==='ar'&&v.sub?Number(v.sub)*(1+(Number(v.tax)||0)/100):null;
 return `<div class="scrim" onclick="closeOv()"></div><div class="modal"><form class="box" role="dialog" aria-modal="true" aria-labelledby="fmT" onsubmit="event.preventDefault();saveForm()" novalidate>
 <div class="dr-h"><div style="flex:1"><h2 id="fmT">${T(F.t)}</h2><div class="small muted">${T(GROUPS[F.g]||['Accounting adjustments','التسويات المحاسبية'])}</div></div><button type="button" class="iconbtn" onclick="closeOv()" aria-label="${L('Close','إغلاق')}">${icon('close')}</button></div>
 <div class="dr-b" style="gap:0"><div class="grid2">${F.f.map(f=>{const ai=f.ai&&S.aiAvail&&!v[f.k]?`<div class="hint" style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">${icon('ai',14)}${L('AI suggests','يقترح الذكاء الاصطناعي')}: <strong>${L('Software subscriptions','اشتراكات البرمجيات')}</strong> (86%) <button type="button" class="link" onclick="S.overlay.vals.${f.k}='sw';render()">${L('Use suggestion','استخدام الاقتراح')}</button></div>`:'';
  const ty=f.ty==='money'||f.ty==='money0'?'text':f.ty;
  return `<div style="${f.full?'grid-column:1/-1':''}">${field({id:'f'+f.k,label:T(f.l),type:f.ty==='select'?'select':ty,value:v[f.k]??'',on:`S.overlay.vals.${f.k}=this.value${f.ty==='select'?';render()':''}`,err:e[f.k],req:f.req,opts:f.o?OPT(f.o):null,attrs:(f.ty.startsWith('money')?'inputmode="decimal" dir="ltr"':'')+(f.ltr||f.ty==='date'||f.ty==='month'?' dir="ltr"':''),hint:f.hint?T(f.hint):'',extra:ai}).replace('id="f_f','id="ff_').replace('for="f_f','for="ff_')}</div>`}).join('')}</div>
 ${gross!=null&&!isNaN(gross)?`<p class="small" style="margin-bottom:12px">${L('Gross amount','المبلغ الإجمالي')}: ${money(gross)} · ${L('Outstanding','المتبقي')}: ${money(gross-(Number(v.paid)||0))}</p>`:''}
 <div class="note info">${icon('info',18)}<span>${T(F.note)}</span></div>
 ${pend?`<div class="note warn" style="margin-top:10px">${icon('lock',18)}<span>${L('Your company requires CEO approval for this action. Saving will submit a request — nothing is posted until it is approved.','تتطلب شركتك موافقة الرئيس التنفيذي على هذا الإجراء. سيؤدي الحفظ إلى إرسال طلب — ولن يُرحَّل شيء قبل الاعتماد.')}</span></div>`:''}
 ${S.screen==='app'&&S.policy&&S.role==='CEO'?`<div class="placeholder-box" style="margin-top:10px"><div class="ph-label">${L('Open decision','قرار مفتوح')}</div>${L('How a CEO-initiated action is handled when policy requires CEO approval is undecided (§5.3, §10.4). The prototype saves directly.','لم يُحسم بعد كيفية التعامل مع إجراء يبدأه الرئيس التنفيذي عندما تتطلب السياسة موافقته (§5.3، §10.4). يحفظ النموذج الأولي مباشرة.')}</div>`:''}
 </div><div class="dr-f"><button type="button" class="btn ghost" onclick="closeOv()">${L('Cancel','إلغاء')}</button><button class="btn primary" type="submit">${pend?L('Submit for approval','إرسال للموافقة'):L('Save','حفظ')}</button></div></form></div>`}
function saveForm(){const o=S.overlay,F=FORMS[o.form],v=o.vals,e={};const num=x=>Number(String(x??'').replace(/,/g,''));
 F.f.forEach(f=>{const x=v[f.k];if(f.req&&(x==null||String(x).trim()===''))e[f.k]=L('This field is required.','هذا الحقل مطلوب.');else if(f.ty==='money'&&x!=null&&x!==''&&!(num(x)>0))e[f.k]=L('Enter a positive amount.','أدخل مبلغًا موجبًا.');else if(f.ty==='money0'&&x&&(isNaN(num(x))||num(x)<0))e[f.k]=L('Enter 0 or a positive amount.','أدخل 0 أو مبلغًا موجبًا.')});
 if(o.form==='ar'&&!e.paid&&v.paid){const g=num(v.sub)*(1+(num(v.tax)||0)/100);if(num(v.paid)>g)e.paid=L('Paid-to-date can\'t exceed the gross amount','لا يمكن أن يتجاوز المدفوع المبلغ الإجمالي')+` (JOD ${fmt(g)}).`}
 if(o.form==='ap'&&!e.paid&&v.paid&&num(v.paid)>num(v.gross))e.paid=L('Paid-to-date can\'t exceed the gross amount.','لا يمكن أن يتجاوز المدفوع المبلغ الإجمالي.');
 if(o.form==='ar'&&v.issue&&v.due&&v.due<v.issue)e.due=L('Due date can\'t be before the issue date.','لا يمكن أن يسبق تاريخ الاستحقاق تاريخ الإصدار.');
 if(o.form==='obl'&&v.end&&v.start&&v.end<v.start)e.end=L('End date must be after the first due date.','يجب أن يكون تاريخ الانتهاء بعد تاريخ الاستحقاق الأول.');
 o.err=e;if(Object.keys(e).length){render();const k=Object.keys(e)[0];document.getElementById('ff_'+k)?.focus();return}
 const k=o.form;S.overlay=null;
 if(S.screen!=='app'){if(F.g==='ADJ')S.counts.ADJ++;else{S.counts[F.g]++;S.groups[F.g]='entered'}render();toast(L('Record saved.','تم حفظ السجل.'));return}
 if(S.policy&&S.role!=='CEO'){S.approvals.unshift({id:'APR-'+(312+S.approvals.length),by:ROLES[S.role][2],type:[T(F.t),T(F.t)],ref:v.num||v.desc||v.title||'—',field:['New record','سجل جديد'],before:'—',after:k==='trx'?`${v.dir} JOD ${fmt(num(v.amount))}`:(v.amount||v.gross||v.sub||'—'),reason:['Submitted from quick create','أُرسل من الإنشاء السريع'],on:AS_OF,status:'pending',mine:true});render();toast(L('Submitted for CEO approval — not posted yet.','أُرسل لموافقة الرئيس التنفيذي — لم يُرحَّل بعد.'));return}
 if(k==='trx'&&v.date&&v.date<=AS_OF){const a=num(v.amount)*(v.dir==='IN'?1:-1);S.cashDelta+=a;if(a>0)S.addIn+=a;else S.addOut+=-a;if(v.date.startsWith('2026-10')){if(a>0)S.octIn+=a;else S.octOut+=-a}}
 toast(k==='trx'?L('Transaction saved. Cash is recalculated; revenue is not affected (cash ≠ revenue).','تم حفظ المعاملة. يُعاد احتساب النقد؛ ولا تتأثر الإيرادات (النقد ≠ الإيرادات).'):L('Record saved.','تم حفظ السجل.'));recalc('save')}

/* =========================================================
   UI STATES GALLERY (§7.7)
   ========================================================= */
function rStates(){const card=(t,b)=>`<div class="card"><h4>${t}</h4>${b}</div>`;
 return `<div class="page-h"><div><h1>${L('UI States Gallery','معرض حالات الواجهة')}</h1><p class="muted small">${L('Reference examples for every universal state in §7.7. Prototype-only page.','أمثلة مرجعية لكل حالة عامة في §7.7. صفحة للنموذج الأولي فقط.')}</p></div></div>
 <div class="gal" style="margin-top:14px">
 ${card(L('Loading','التحميل'),`<div class="skel" style="height:14px;width:50%"></div><div class="skel" style="height:30px;width:75%"></div><p class="tiny muted">${L('Skeletons — never a misleading 0.','هياكل تحميل — وليس صفرًا مضللًا أبدًا.')}</p>`)}
 ${card(L('Empty','فارغ'),`<div class="empty" style="padding:6px"><p class="small">${L('No supplier invoices yet.','لا توجد فواتير موردين بعد.')}</p><div class="row"><span class="pill p-neutral">${L('Not Provided','غير مُقدَّم')}</span><span class="small muted">≠</span><span class="pill p-info">${L('Confirmed None','لا يوجد (مؤكَّد)')}</span></div><button class="btn sm">${icon('plus',14)}${L('Add supplier invoice','إضافة فاتورة مورد')}</button></div>`)}
 ${card(L('Insufficient Data','بيانات غير كافية'),`<div class="insuf" style="color:var(--warn);font-weight:600;display:flex;gap:6px">${icon('alert',18)}${L('Insufficient Data','بيانات غير كافية')}</div><p class="small muted">${L('Revenue growth needs a comparable prior period. Records start Jun 2026.','يتطلب نمو الإيرادات فترة سابقة قابلة للمقارنة. تبدأ السجلات في يونيو 2026.')}</p>`)}
 ${card('N/A',`<div class="row"><span>${L('Gross margin','الهامش الإجمالي')}</span><strong>${L('N/A','غير متاح')}</strong></div><p class="small muted">${L('Revenue for the period is 0, so the ratio is undefined — shown as N/A, not 0%.','إيرادات الفترة صفر، لذا النسبة غير معرّفة — تُعرض "غير متاح" وليس 0%.')}</p>`)}
 ${card(L('Validation error','خطأ في التحقق'),field({id:'demoV',label:L('Paid-to-date (JOD)','المدفوع حتى تاريخه (د.أ)'),value:'3,100',on:'',err:L('Paid-to-date can\'t exceed the gross amount (JOD 2,860).','لا يمكن أن يتجاوز المدفوع المبلغ الإجمالي (2,860 د.أ).'),attrs:'dir="ltr"'}))}
 ${card(L('Permission denied','رفض الصلاحية'),`<div class="row">${icon('lock',20)}<span class="small">${L('You don\'t have access to Team & Access. The API returns 403 even for direct links.','ليست لديك صلاحية الوصول إلى الفريق والصلاحيات. تُرجع الواجهة البرمجية 403 حتى للروابط المباشرة.')}</span></div><button class="btn sm" onclick="S.page='team';S.role='Accountant';render()">${L('Try a deep link as Accountant','جرّب رابطًا مباشرًا كمحاسب')}</button>`)}
 ${card(L('Pending CEO approval','بانتظار موافقة الرئيس التنفيذي'),`<div class="note warn">${icon('lock',18)}<span>${L('Change to SB-1044 is waiting for the CEO. It is not reflected in official figures yet.','التغيير على SB-1044 بانتظار الرئيس التنفيذي. لا يظهر في الأرقام الرسمية بعد.')}</span></div>`)}
 ${card(L('AI unavailable','الذكاء الاصطناعي غير متاح'),`<div class="note warn">${icon('ai',18)}<span>${L('AI suggestions are unavailable. Map and classify manually — verified calculations keep working.','اقتراحات الذكاء الاصطناعي غير متاحة. اربط وصنّف يدويًا — تستمر الحسابات الموثّقة بالعمل.')}</span></div>`)}
 ${card(L('Updating metrics','تحديث المؤشرات'),`<div class="snap" style="margin:0"><span class="spin"></span><strong>${L('Updating metrics…','جارٍ تحديث المؤشرات…')}</strong><span class="muted small">${L('Showing previous snapshot until done.','عرض اللقطة السابقة حتى الانتهاء.')}</span></div>`)}
 ${card(L('Concurrency conflict','تعارض متزامن'),`<div class="note bad">${icon('refresh',18)}<span>${L('Someone changed this invoice after you opened it. Review their version before saving — nothing was overwritten.','غيّر شخص ما هذه الفاتورة بعد أن فتحتها. راجع نسخته قبل الحفظ — لم يُستبدل أي شيء.')}</span></div><div class="row"><button class="btn sm">${L('Compare changes','مقارنة التغييرات')}</button><button class="btn sm ghost">${L('Reload','إعادة التحميل')}</button></div>`)}
 ${card(L('Session expired','انتهت الجلسة'),`<div class="note info">${icon('lock',18)}<span>${L('Your session expired. Log in again — your unsaved form will be restored, never auto-submitted.','انتهت جلستك. سجّل الدخول مجددًا — سيُستعاد نموذجك غير المحفوظ دون إرساله تلقائيًا.')}</span></div>`)}
 ${card(L('Official vs hypothetical','رسمي مقابل افتراضي'),`<div class="row"><span class="badge-official">${L('OFFICIAL','رسمي')}</span><span class="small">${L('From committed records','من سجلات معتمدة')}</span></div><div class="row"><span class="badge-hypo">${L('HYPOTHETICAL','افتراضي')}</span><span class="small">${L('Decision Lab scenario — never posted','سيناريو مختبر القرارات — لا يُرحَّل أبدًا')}</span></div><div class="row">${scopeTag.period()}${scopeTag.asof()}${scopeTag.fc(30)}</div>`)}
 ${card(L('Readiness calculation failed','فشل احتساب الجاهزية'),`<div class="note bad">${icon('alert',18)}<span>${L('We couldn\'t calculate readiness. Your data is safe.','تعذّر احتساب الجاهزية. بياناتك آمنة.')}</span></div><button class="btn sm">${icon('refresh',14)}${L('Retry','إعادة المحاولة')}</button>`)}
 </div>`}

/* =========================================================
   PROTOTYPE CONTROLS
   ========================================================= */
function rDev(){if(!S.devOpen)return `<div class="dev"><button class="dev-pill" onclick="S.devOpen=true;render()" aria-expanded="false">${icon('sliders',16)}${L('Prototype controls','أدوات النموذج')}</button></div>`;
 const screens=[['landing','Landing'],['register','Sign-up'],['verify','Verify email'],['login','Log in'],['forgot','Forgot password'],['company','Create workspace'],['finance','Financial setup'],['method','Data method'],['import','CSV import'],['manual','Start from scratch'],['readiness','Readiness'],['app:summary','Summary (full demo data)'],['app:charts','All charts'],['app:states','UI states gallery']];
 return `<div class="dev"><div class="dev-panel" role="region" aria-label="Prototype controls"><div class="row"><strong>${L('Prototype controls','أدوات النموذج')}</strong><div class="spacer"></div><button class="dev-pill" style="padding:4px 8px;box-shadow:none" onclick="S.devOpen=false;render()" aria-label="Close">${icon('close',14)}</button></div>
 <label>${L('Jump to screen','الانتقال إلى شاشة')}<select onchange="jump(this.value)"><option value="">—</option>${screens.map(s=>`<option value="${s[0]}">${s[1]}</option>`).join('')}</select></label>
 <label>${L('View as','عرض كـ')}<select onchange="setRole(this.value)">${Object.keys(ROLES).map(k=>`<option value="${k}" ${S.role===k?'selected':''}>${ROLES[k][0]}</option>`).join('')}</select></label>
 <label>${L('Summary state','حالة الملخص')}<select onchange="S.sumState=this.value;render()">${[['normal','Normal'],['loading','Loading'],['empty','Empty (no records)']].map(s=>`<option value="${s[0]}" ${S.sumState===s[0]?'selected':''}>${s[1]}</option>`).join('')}</select></label>
 <button class="d" onclick="recalc('save')">${L('Trigger "Updating metrics…"','تشغيل "تحديث المؤشرات…"')}</button>
 <label class="tg"><input type="checkbox" ${S.aiAvail?'checked':''} onchange="S.aiAvail=this.checked;render()">${L('AI available','الذكاء الاصطناعي متاح')}</label>
 <label class="tg"><input type="checkbox" ${S.policy?'checked':''} onchange="S.policy=this.checked;render()">${L('Policy: new records & imports need CEO approval','السياسة: السجلات والاستيراد تحتاج موافقة الرئيس التنفيذي')}</label>
 <label class="tg"><input type="checkbox" ${S.groups.D1==='attention'?'checked':''} onchange="S.groups.D1=this.checked?'attention':'configured';S.fin.unknown=this.checked;render()">${L('Opening cash unknown','النقد الافتتاحي غير معروف')}</label>
 <button class="d" onclick="resetProto()">${L('Reset prototype','إعادة ضبط النموذج')}</button>
 <p class="tiny" style="color:#AEB4BC">${L('Fixture: Petra Digital Solutions (fictional). Jun–Sep history is demo data; Oct 2026 and as-of values match §6.9.','البيانات: بترا للحلول الرقمية (افتراضية). تاريخ يونيو–سبتمبر بيانات تجريبية؛ قيم أكتوبر 2026 والقيم الحالية مطابقة لـ §6.9.')}</p></div></div>`}
function resetProto(){try{localStorage.removeItem('fp_slots')}catch(e){}S=fresh();render()}
function jump(v){if(!v)return;if(v.startsWith('app:')){setFullData();S.screen='app';const p=v.split(':')[1];S.page=(p==='summary'&&!canPage('summary'))?'summary':p;S.overlay=null;render();window.scrollTo(0,0);return}
 if(v==='import'){S.imp=freshImp();S.impInApp=false}if(['finance','method','import','manual','readiness'].includes(v)&&!S.companyCreated){S.companyCreated=true;if(S.groups.D1==='np')S.groups.D1='configured'}go(v)}

/* keyboard: Escape closes overlays & menus */
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(S.overlay){closeOv()}else if(S.menu){S.menu=null;render()}else if(S.sidebarOpen){S.sidebarOpen=false;render()}}});
document.addEventListener('click',e=>{if(S.menu&&!e.target.closest('.menu-wrap')){S.menu=null;render()}});
render();
</script>
